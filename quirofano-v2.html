<style>

label{display:block;font-size:12px;color:var(--gris);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--pr);color:var(--on-pr);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}

.btn.rojo,.btn.verde,.btn.azul{color:#0D1117}

.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--linea);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}

main{padding:14px 14px 100px;max-width:1200px;margin:0 auto}

.muted{color:var(--gris);font-size:13px}

.p-azul{background:var(--azul2);color:var(--azul)}.p-morado{background:var(--morado2);color:var(--morado)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--gris);font-weight:600;padding:6px;border-bottom:1px solid var(--linea)}
td{padding:8px 6px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tblwrap{overflow-x:auto}

.cattabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}

.cattabs button span{font-size:12px;color:var(--gris)}.cattabs button.on{background:var(--pr2);border-color:var(--pr);color:var(--pr)}.cattabs button.on span{color:var(--pr);opacity:.85}

.hoja .conc{margin-top:8px}.hoja .conc .sub{font-size:11px}.hoja .conc tr.lio td{font-size:11px;color:var(--gris)}

nav button b{display:flex;justify-content:center;margin-bottom:2px}

.hello{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 12px}

.banner.rojo{background:var(--rojo2);color:var(--rojo);border:1px solid var(--rojo)}.banner.amar{background:var(--amar2);color:var(--amar);border:1px solid var(--amar)}

.printdoc{font-size:12px;background:#fff;color:#000;border-radius:8px;padding:14px;--ink:#000;--gris:#555;--fondo:#F3F3F3;--card:#fff;--card2:#F6F8FA;--linea:#D0D7DE;--amar2:#FFF4E0;--amar:#9A6210;--rojo:#B42318;--rojo2:#FBE4E1;--verde:#2C7549;--verde2:#E0F0E6;--azul:#1D4F66;--azul2:#DCE9EF}

const OFF={on:false,real:null,cache:{},cola:[],falla:[],sync:false,listo:null,ok:0,desde:null};

function _idb(){return new Promise((res,rej)=>{if(OFF._db)return res(OFF._db);if(!window.indexedDB)return rej('sin idb');const r=indexedDB.open('qx_offline',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{OFF._db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})}

function prepIds(tb,ch){if(!/^qx_/.test(tb)||tb==='qx_config')return ch;

const _cmp=(x,y)=>{if(x==null&&y==null)return 0;if(x==null)return -1;if(y==null)return 1;const nx=Number(x),ny=Number(y);if(x!==''&&y!==''&&!isNaN(nx)&&!isNaN(ny)&&typeof x!=='boolean')return nx-ny;return String(x)<String(y)?-1:String(x)>String(y)?1:0};
function filtrar(rows,ch){let r=rows;const ords=[];let lim=null,rng=null;
  for(const [m,a] of ch){const [c,v]=a;
    if(m==='eq')r=r.filter(x=>String(x[c])===String(v));else if(m==='neq')r=r.filter(x=>String(x[c])!==String(v));
    else if(m==='gt')r=r.filter(x=>_cmp(x[c],v)>0);else if(m==='gte')r=r.filter(x=>x[c]!=null&&_cmp(x[c],v)>=0);
    else if(m==='lt')r=r.filter(x=>x[c]!=null&&_cmp(x[c],v)<0);else if(m==='lte')r=r.filter(x=>x[c]!=null&&_cmp(x[c],v)<=0);
    else if(m==='in')r=r.filter(x=>(v||[]).map(String).includes(String(x[c])));else if(m==='is')r=r.filter(x=>(x[c]??null)===v);

  if(m==='insert'||m==='upsert'){const rs=(Array.isArray(a[0])?a[0]:[a[0]]).map(r=>({created_at:now,updated_at:now,...r}));
    for(const r of rs){const i=r[k]!=null?T.findIndex(x=>String(x[k])===String(r[k])):-1;if(i>=0){if(!(m==='upsert'&&a[1]?.ignoreDuplicates))T[i]={...T[i],...r};out.push({...T[i]})}else{T.push({...r});out.push({...r})}}}
  else if(m==='update'){const hit=filtrar(T,ch.filter(([x])=>!['order','limit','range'].includes(x)));hit.forEach(x=>Object.assign(x,a[0]));out=hit.map(x=>({...x}));
    if(!hit.length){const e=ch.find(([x,y])=>x==='eq'&&y[0]===k);if(e)out=[{[k]:e[1][1],...a[0]}]}}

function guardarLectura(tb,ch,data){if(data==null)return;const rows=Array.isArray(data)?data:[data];const k=keyOf(tb);

  const T=OFF.cache[tb]=OFF.cache[tb]||[];const ix=new Map(T.map((x,i)=>[String(x[k]),i]));

async function ejecQ(tb,ch){

async function sincronizar(){if(OFF.sync||!OFF.real)return;OFF.sync=true;

function barraOffline(modo){let d=document.getElementById('offBar');

}

/* ---------- carga de datos ---------- */
async function loadAll(){
  const desde=addDays(hoyISO(),-45),hasta=addDays(hoyISO(),120);
  const [sedes,ubic,esp,mat,lotes,lios,paq,paqItems,cx,tanques,conteos,config,prov]=await Promise.all([
    q(sb.from('qx_sedes').select('*').order('nombre')),
    q(sb.from('qx_ubicaciones').select('*')),
    q(sb.from('qx_especialidades').select('*').order('nombre')),
    q(sb.from('qx_materiales').select('*').order('nombre')),
    q(sb.from('qx_lotes').select('*')),
    q(sb.from('qx_lio_unidades').select('*').or('estado.in.(disponible,reservado),implantado_at.gte.'+desde).order('dioptria')),
    q(sb.from('qx_paquetes').select('*').order('nombre')),
    q(sb.from('qx_paquete_items').select('*')),
    q(sb.from('qx_cirugias').select('*').gte('fecha',desde).lte('fecha',hasta).order('fecha').order('hora')),
    q(sb.from('qx_tanques').select('*').order('nombre')),
    q(sb.from('qx_conteos').select('*').order('created_at',{ascending:false}).limit(60)),
    q(sb.from('qx_config').select('*')),
    sb.from('fin_entidades').select('id,nombre,tipo,activo').eq('tipo','proveedor').order('nombre').then(r=>r.data||[])
  ]);
  Object.assign(S,{sedes,ubic,esp,mat,lotes,lios,paq,paqItems,cx,tanques,conteos,prov});
  S.config={};config.forEach(c=>S.config[c.clave]=c.valor);
  const ids=cx.map(c=>c.id);
  S.cxItems=ids.length?await q(sb.from('qx_cirugia_items').select('*').in('cirugia_id',ids)):[];
  S.evid=ids.length?await q(sb.from('qx_cirugia_evidencias').select('*').in('cirugia_id',ids).order('created_at')):[];
  S.usuarios=await sb.from('qx_usuarios').select('id,nombre,usuario,rol,activo,modulos,permisos').order('nombre').then(r=>r.data||[]);
  const tids=tanques.map(t=>t.id);
  S.lect=tids.length?await q(sb.from('qx_lecturas_tanque').select('*').in('tanque_id',tids).order('created_at',{ascending:false}).limit(400)):[];
  S.escal=await sb.from('qx_escalamientos').select('*').order('created_at',{ascending:false}).limit(200).then(r=>r.data||[]);
  S.precios=await sb.from('qx_precios').select('*').order('orden').then(r=>r.data||[]);
  S.cotsDash=(tiene('aprobar')||S.user?.rol==='director')?await sb.from('qx_cotizaciones').select('id,folio,paciente_nombre,telefono1,created_at,total,estado,vigencia_hasta,cirugia_ids,items,sede_id').gte('created_at',addDays(hoyISO(),-75)+'T00:00:00').order('created_at',{ascending:false}).limit(600).then(r=>r.data||[]):[];
  S.camps=await sb.from('qx_campanas').select('*').order('created_at',{ascending:false}).then(r=>r.data||[]);
  S.campPac=S.camps.some(c=>c.activa)?await sb.from('qx_campana_pacientes').select('*').in('campana_id',S.camps.map(c=>c.id)).order('created_at').then(r=>r.data||[]):[];
  S.carroRev=await sb.from('qx_carro_revisiones').select('*').order('created_at',{ascending:false}).limit(60).then(r=>r.data||[]);
  try{if(!OFF.on)await syncMensajes();await cargarMensajes()}catch(e){console.error('mensajes',e)}
  S.pedidos=await sb.from('fin_pedidos').select('id,folio,area,sede,descripcion,partidas,urgente,estado,solicitado_at,autorizado_at,enviado_at,recibido_at,notas,created_at').eq('area','Quirófano').order('created_at',{ascending:false}).limit(80).then(r=>r.data||[]);
  if(!S.sede||!sedeById(S.sede)){const pref=safeLS('qx_sede');S.sede=(sedeById(pref)?pref:null)||(S.sedes.find(s=>s.nombre.startsWith('Tac'))||S.sedes[0]||{}).id}
  try{if(!OFF.on){await escalarInventarios();await escalarExtra()}}catch(e){console.error('escalar',e)}
}

/* ---------- cálculos de inventario ---------- */
function stockMat(mid,ubicSet){return S.lotes.filter(l=>l.material_id===mid&&(!ubicSet||ubicSet.has(l.ubicacion_id))).reduce((a,l)=>a+num(l.cantidad),0)}
function stockUbic(mid,uid){return S.lotes.filter(l=>l.material_id===mid&&l.ubicacion_id===uid).reduce((a,l)=>a+num(l.cantidad),0)}
function demandaMat(mid,dias,excluirCx){
  const lim=addDays(hoyISO(),dias),salas=ubicIdsSede();
  const cxs=new Set(S.cx.filter(c=>['programada','confirmada'].includes(c.estado)&&!c.consumo_cerrado&&c.fecha>=hoyISO()&&c.fecha<=lim&&salas.has(c.sala_id)&&c.id!==excluirCx).map(c=>c.id));
  return S.cxItems.filter(i=>cxs.has(i.cirugia_id)&&i.material_id===mid).reduce((a,i)=>a+num(i.cantidad_plan),0)
}
function pedidoAbierto(mid){return S.pedidos.find(p=>!['recibido','cancelado','rechazado','pagado'].includes(p.estado)&&!p.recibido_at&&(p.partidas||[]).some(x=>x.material_id===mid))}
function semaforo(m){
  const st=stockMat(m.id,ubicIdsSede()),dem=demandaMat(m.id,num(cfg('dias_proyeccion',14)));
  let nivel='ok';
  const mn=num(m.stock_minimo);
  if(mn>0&&st<=num(m.stock_critico))nivel='critico';
  else if(mn>0&&st<=mn)nivel='minimo';
  else if(st-dem<=num(m.stock_minimo))nivel='agotarse';
  return {st,dem,nivel,proy:st-dem}
}
const NIV={critico:['k-crit','Nivel crítico'],minimo:['k-warn','En mínimo'],agotarse:['k-warn','Por agotarse'],ok:['k-ok','Suficiente']};
function alertasMat(){return matsQX().map(m=>({m,...semaforo(m)})).filter(x=>x.nivel!=='ok').sort((a,b)=>(CRIT_ORD.indexOf(critOf(a.m))-CRIT_ORD.indexOf(critOf(b.m)))||(['critico','minimo','agotarse'].indexOf(a.nivel)-['critico','minimo','agotarse'].indexOf(b.nivel)))}
function lecturaUlt(tid){return S.lect.find(l=>l.tanque_id===tid)}
function nivelTanque(t){const l=lecturaUlt(t.id);if(!l)return 'sin';const p=num(l.presion);return p<=num(t.presion_critica)?'critico':p<=num(t.presion_alerta)?'minimo':'ok'}
function totalAlertas(){
  const sedeU=ubicIdsSede();
  let n=alertasMat().filter(a=>a.nivel==='critico'||critOf(a.m)==='critico').length;
  n+=S.tanques.filter(t=>t.activo&&(t.sede_id===S.sede)&&nivelTanque(t)==='critico').length;
  n+=conteoVencido().length;
  n+=alarmasPend().length;
  n+=S.cx.filter(c=>sedeU.has(c.sala_id)&&['programada','confirmada'].includes(c.estado)&&c.fecha>=hoyISO()&&c.fecha<=addDays(hoyISO(),2)&&!readiness(c).listo).length;
  const qxU=new Set(ubicSede().map(u=>u.id));
  n+=S.lotes.filter(l=>qxU.has(l.ubicacion_id)&&num(l.cantidad)>0&&l.caducidad&&diasHasta(l.caducidad)<0).length;
  n+=carroResumen().alerta;
  return n
}

/* ---------- candados: pago, seguridad, LIO ---------- */
const anticipoMin=total=>Math.max(num(cfg('anticipo_minimo_monto',1000)),num(total)*num(cfg('anticipo_minimo_pct',0))/100);
const evidCx=(id,tipo)=>S.evid.filter(e=>e.cirugia_id===id&&(!tipo||e.tipo===tipo));
function finCx(c){
  const ev=evidCx(c.id).filter(e=>!e.rechazado_por);
  const pag=ev.filter(e=>['anticipo','abono','liquidacion'].includes(e.tipo)).reduce((a,e)=>a+num(e.monto),0)-ev.filter(e=>e.tipo==='reembolso').reduce((a,e)=>a+num(e.monto),0);
  const total=num(c.costo_total),saldo=Math.max(0,total-pag),min=anticipoMin(total);
  let liq=total>0?saldo<=0.5:ev.some(e=>e.tipo==='liquidacion');let est,cls;
  if(total===0&&(c.checklist||{}).cortesia){liq=true;est='Cortesía autorizada';cls='p-morado'}
  else if(liq){est='Liquidado';cls='p-verde'}
  else if(pag>0&&pag>=min){est='Anticipo · saldo '+money(saldo);cls='p-amar'}
  else if(pag>0){est='Anticipo insuficiente';cls='p-amar'}
  else if(c.sin_anticipo_autorizado_por){est='Sin anticipo (autorizado)';cls='p-morado'}
  else{est='Sin pago';cls='p-amar'}
  return {pag,total,saldo,liq,min,est,cls,ev}
}
function powerMatch(l,r){
  if(!l||!r)return false;
  if(r.dioptria!==''&&r.dioptria!=null&&Math.abs(num(l.dioptria)-num(r.dioptria))>0.01)return false;
  if(r.cilindro!==''&&r.cilindro!=null&&num(r.cilindro)!==0&&Math.abs(num(l.cilindro)-num(r.cilindro))>0.01)return false;
  if(r.adicion!==''&&r.adicion!=null&&num(r.adicion)!==0&&Math.abs(num(l.adicion)-num(r.adicion))>0.01)return false;
  if(r.tipo&&l.tipo&&r.tipo!==l.tipo)return false;
  return true
}
const lioTxt=r=>r?`${r.tipo||''} ${r.modelo&&r.modelo!==r.tipo?r.modelo:''} ${r.dioptria!==''&&r.dioptria!=null?fmtN(r.dioptria)+' D':''}${r.cilindro&&num(r.cilindro)?' Cil '+fmtN(r.cilindro):''}${r.eje?' Eje '+r.eje+'°':''}${r.adicion&&num(r.adicion)?' Add '+fmtN(r.adicion):''}`.replace(/\s+/g,' ').trim():'';
function readiness(c){
  const f=finCx(c),ck=c.checklist||{},req=!!c.lio_requerido,lio=c.lio_unidad_id?S.lios.find(l=>l.id===c.lio_unidad_id):null;
  const it=[
    {k:'cotizacion',t:'Cotización vinculada',ok:!!c.cotizacion_id||!!c.sin_cotizacion_autorizado_por,grupo:'pago'},
    {k:'anticipo',t:'Anticipo con comprobante',ok:(f.pag>0&&f.pag>=f.min)||!!c.sin_anticipo_autorizado_por,grupo:'pago'},

async function subirArchivo(file,carpeta){
  if(OFF.on)throw new Error('Sin conexión: las fotos y archivos se pueden subir cuando regrese la conexión');
  const img=(file.type||'').startsWith('image/');
  const blob=img?await comprimir(file):file;
  const ext=img?'jpg':((file.name||'').split('.').pop()||'pdf').toLowerCase();
  const path=`${carpeta}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const up=await sb.storage.from('qx-fotos').upload(path,blob,{contentType:img?'image/jpeg':(file.type||'application/pdf')});
  if(up.error)throw up.error;
  return sb.storage.from('qx-fotos').getPublicUrl(path).data.publicUrl
}

/* ---------- consumo FEFO ---------- */
async function descontar(mid,uidPref,cant,meta){
  let resto=num(cant);if(resto<=0)return;
  const sedeU=ubicIdsSede();
  const ordenar=arr=>arr.filter(l=>num(l.cantidad)>0).sort((a,b)=>(a.caducidad||'9999')<(b.caducidad||'9999')?-1:1);
  const pref=ordenar(S.lotes.filter(l=>l.material_id===mid&&l.ubicacion_id===uidPref));
  const otros=ordenar(S.lotes.filter(l=>l.material_id===mid&&l.ubicacion_id!==uidPref&&sedeU.has(l.ubicacion_id)));
  for(const l of [...pref,...otros]){
    if(resto<=0)break;const t=Math.min(resto,num(l.cantidad));
    await q(sb.from('qx_lotes').update({cantidad:num(l.cantidad)-t,updated_at:new Date().toISOString()}).eq('id',l.id));
    l.cantidad=num(l.cantidad)-t;resto-=t;
    await q(sb.from('qx_movimientos').insert({tipo:meta.tipo||'consumo',material_id:mid,lote_id:l.id,ubicacion_id:l.ubicacion_id,cantidad:-t,cirugia_id:meta.cirugia_id||null,usuario_id:S.user.id,usuario_nombre:S.user.nombre,nota:meta.nota||null}));
  }
  if(resto>0){ // sin existencia registrada: se deja en negativo para que el conteo lo corrija
    let l=S.lotes.find(x=>x.material_id===mid&&x.ubicacion_id===uidPref&&x.lote==='SIN LOTE');
    if(!l){l=(await q(sb.from('qx_lotes').insert({material_id:mid,ubicacion_id:uidPref,lote:'SIN LOTE',cantidad:0}).select()))[0];S.lotes.push(l)}
    await q(sb.from('qx_lotes').update({cantidad:num(l.cantidad)-resto}).eq('id',l.id));l.cantidad=num(l.cantidad)-resto;
    await q(sb.from('qx_movimientos').insert({tipo:meta.tipo||'consumo',material_id:mid,lote_id:l.id,ubicacion_id:uidPref,cantidad:-resto,cirugia_id:meta.cirugia_id||null,usuario_id:S.user.id,usuario_nombre:S.user.nombre,nota:'Sin existencia registrada. '+(meta.nota||'')}));
  }
}
async function ingresar(mid,uid,lote,cad,cant,meta){
  lote=(lote||'').trim()||null;
  let l=S.lotes.find(x=>x.material_id===mid&&x.ubicacion_id===uid&&(x.lote||null)===lote&&(x.caducidad||null)===(cad||null));
  if(l){await q(sb.from('qx_lotes').update({cantidad:num(l.cantidad)+num(cant),updated_at:new Date().toISOString()}).eq('id',l.id));l.cantidad=num(l.cantidad)+num(cant)}
  else{l=(await q(sb.from('qx_lotes').insert({material_id:mid,ubicacion_id:uid,lote,caducidad:cad||null,cantidad:num(cant),...(meta.consig!=null?{consignacion:!!meta.consig}:{}),...(meta.proveedor?{proveedor:meta.proveedor}:{})}).select()))[0];S.lotes.push(l)}
  if(l&&meta.consig&&!l.consignacion){await sb.from('qx_lotes').update({consignacion:true,proveedor:meta.proveedor||l.proveedor||null}).eq('id',l.id);l.consignacion=true}
  await q(sb.from('qx_movimientos').insert({tipo:meta.tipo||'entrada',material_id:mid,lote_id:l.id,ubicacion_id:uid,cantidad:num(cant),conteo_id:meta.conteo_id||null,usuario_id:S.user.id,usuario_nombre:S.user.nombre,nota:meta.nota||null,...(meta.doc?{documento_url:meta.doc}:{}),...(meta.consig!=null?{consignacion:!!meta.consig}:{})}));
  return l
}

function modal(html,cls){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box ${cls||''}">${html}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m&&!m.dataset.lock)closeModal(m)});return m}
function closeModal(m){(m||document.querySelector('.modal:last-of-type'))?.remove();if(!document.querySelector('.modal'))render()}
function mhead(t){return `<div class="mhead"><h3>${t}</h3><button class="x" onclick="closeModal(this.closest('.modal'))">×</button></div>`}
function pedirPIN(motivo){
  return new Promise(res=>{
    let v='';const m=modal(`<div class="mhead"><h3>Firma con PIN</h3><button class="x">×</button></div><div class="muted">${h(motivo)}</div><div class="pindots">${'<i></i>'.repeat(4)}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button ${k===''?'disabled style="visibility:hidden"':''} data-k="${k}">${k}</button>`).join('')}</div><div class="muted" id="pinerr" style="color:var(--rojo);text-align:center;margin-top:8px"></div>`,'sm');
    m.dataset.lock=1;
    const dots=()=>m.querySelectorAll('.pindots i').forEach((d,i)=>d.classList.toggle('f',i<v.length));
    m.querySelector('.x').onclick=()=>{m.remove();res(false)};
    m.querySelectorAll('.pinpad button').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;if(k==='⌫'){v=v.slice(0,-1);dots();return}
      if(v.length>=4)return;v+=k;dots();
      if(v.length===4){
        const hsh=await pinHash(S.user.usuario,v);
        const r=await sb.from('qx_usuarios').select('pin_hash,activo').eq('id',S.user.id).single();
        if(r.data&&r.data.activo&&r.data.pin_hash===hsh){m.remove();res(true)}
        else{v='';dots();m.querySelector('#pinerr').textContent='PIN incorrecto'}
      }
    });
  })
}
function confirmar(msg,tit,okTxt){return new Promise(res=>{const m=modal(`${mhead(tit||'Confirmar')}<div style="margin:8px 0">${msg}</div><div class="acts"><button class="btn sec" id="cn">Cancelar</button><button class="btn" id="cs">${okTxt||'Continuar'}</button></div>`,'sm');m.querySelector('#cn').onclick=()=>{m.remove();res(false)};m.querySelector('#cs').onclick=()=>{m.remove();res(true)};m.querySelector('.x').onclick=()=>{m.remove();res(false)}})}

function pedirTexto(tit,lab,def){return new Promise(res=>{const m=modal(`${mhead(h(tit))}<label>${h(lab)}</label><textarea id="ptT">${h(def||'')}</textarea><div class="acts"><button class="btn sec" id="cn">Cancelar</button><button class="btn" id="cs">Continuar</button></div>`,'sm');m.dataset.lock=1;
  const fin=v=>{m.remove();res(v)};m.querySelector('#cn').onclick=()=>fin(null);m.querySelector('.x').onclick=()=>fin(null);m.querySelector('#cs').onclick=()=>{const v=m.querySelector('#ptT').value.trim();if(!v)return toast('Escribe el motivo',true);fin(v)}})}

  $('#lojo').onclick=()=>{const i=$('#lp');i.type=i.type==='password'?'text':'password'};

      if(usr.password_hash!==await passHash(u,p)){
        const n=(usr.intentos_fallidos||0)+1;
        await sb.from('qx_usuarios').update({intentos_fallidos:n,bloqueado_hasta:n>=5?new Date(Date.now()+15*60e3).toISOString():null}).eq('id',usr.id);
        $('#lerr').textContent=n>=5?'Contraseña incorrecta. Usuario bloqueado 15 minutos; el Director puede desbloquearlo en Más → Usuarios.':`Contraseña incorrecta. Le quedan ${5-n} intento${5-n===1?'':'s'}. Revise mayúsculas y el guion.`;$('#lb').disabled=false;return}
      await sb.from('qx_usuarios').update({intentos_fallidos:0,bloqueado_hasta:null}).eq('id',usr.id);
      S.user={id:usr.id,nombre:usr.nombre,usuario:usr.usuario,rol:usr.rol,modulos:usr.modulos||null,permisos:usr.permisos||null};safeLS('qx_user',JSON.stringify(S.user));safeLS('qx_ultimo',u);safeLS('qx_login_at',new Date().toISOString());
      if(usr.debe_cambiar)return cambiarCredenciales(true);

function cambiarCredenciales(obligatorio){
  const m=modal(`${mhead(obligatorio?'Primer ingreso: define tu contraseña y PIN':'Cambiar contraseña y PIN')}
  <div class="muted">La contraseña es para entrar. El PIN de 4 dígitos es tu firma en cada movimiento.</div>
  <label>Nueva contraseña (mínimo 6)</label><input id="np" type="password">
  <label>Confirmar contraseña</label><input id="np2" type="password">
  <label>Nuevo PIN (4 dígitos)</label><input id="npin" type="password" inputmode="numeric" maxlength="4">
  <div class="acts"><button class="btn" id="ok">Guardar</button></div>`,'sm');
  if(obligatorio){m.dataset.lock=1;m.querySelector('.x').remove()}
  m.querySelector('#ok').onclick=async()=>{
    const p=m.querySelector('#np').value,p2=m.querySelector('#np2').value,pin=m.querySelector('#npin').value;
    if(p.length<6)return toast('La contraseña debe tener al menos 6 caracteres',true);
    if(p!==p2)return toast('Las contraseñas no coinciden',true);
    if(!/^\d{4}$/.test(pin))return toast('El PIN debe ser de 4 dígitos',true);
    if(['0000','1234','1111'].includes(pin))return toast('Elige un PIN menos obvio',true);
    await q(sb.from('qx_usuarios').update({password_hash:await passHash(S.user.usuario,p),pin_hash:await pinHash(S.user.usuario,pin),debe_cambiar:false}).eq('id',S.user.id),'Guardar credenciales');
    m.remove();toast('Credenciales actualizadas');if(obligatorio)await iniciar();
  };
}

function cierrePendiente(){

    for(const d of [t,new Date(t.getTime()-864e5)])if(ini<d&&now>=d)return c}

  let override=null,sinCot=null;

      if(!mot)return;override=mot;

    }
  }
  if(!F.id&&num(F.costo_total)&&num(F.pago.monto)>num(F.costo_total)+0.5)return toast('El anticipo excede el costo total de la cirugía',true);

    paciente_nombre:F.paciente_nombre.trim(),expediente:F.expediente,telefono:F.telefono,cotizacion_id:F.cotizacion_id,cotizacion_tabla:F.cotizacion_tabla,paquete_id:F.paquete_id||null,paquete_nombre:F.paquete_nombre||null,
    lio_unidad_id:F.requiere_lio?F.lio_unidad_id:null,lio_requerido:F.requiere_lio?F.lio:null,notas:F.notas,consigna:[...(F.consigna||[]).filter(x=>x.nombre&&num(x.piezas)>0),...(F.consigna_docs||[])],updated_at:new Date().toISOString(),
    lio_respaldo_id:F.requiere_lio&&F.lio_unidad_id?F.lio_respaldo_id:null,riesgo_diabetes:!!F.dm,riesgo_glaucoma:!!F.gl,
    costo_total:num(F.costo_total),fecha_nacimiento:F.fnac||null,alergias:F.alergias||null,anticoagulantes:F.anticoag||null};

function pasosCx(c,rd,ed){
  const f=rd.f,ok=k=>rd.it.find(x=>x.k===k)?.ok;
  const st=[['Cotización',ok('cotizacion')],['Anticipo con comprobante',ok('anticipo')],['Liquidación con comprobante',f.liq],['Pagos validados',ok('validado')],['Acceso a quirófano',f.liq&&rd.listo]];
  const sig=st.findIndex(x=>!x[1]);
  const btn=sig===1&&ed?`<button class="btn sm" onclick="formPago('${c.id}','anticipo')">Capturar anticipo</button>`:sig===2&&ed?`<button class="btn sm" onclick="formPago('${c.id}','liquidacion')">Capturar liquidación</button>`:sig===3&&can.validar()?'<span class="muted">Valida los pagos abajo</span>':sig===4?'<span class="muted">Completa la lista de verificación</span>':'';
  return `<div class="pasos">${st.map(([t,o],i)=>`<div class="paso ${o?'ok':i===sig?'act':''}"><i>${o?'✓':i+1}</i><span>${t}</span></div>`).join('')}</div>${btn?`<div style="text-align:right;margin:-4px 0 10px">${btn}</div>`:''}`
}

async function validarPago(eid,cid){
  const e=S.evid.find(x=>x.id===eid);
  if(!await confirmar(`¿Confirmas que el ${h(e.tipo)} de <b>${money(e.monto)}</b>${e.folio?' (folio '+h(e.folio)+')':''} ingresó realmente (eOptics / depositador / estado de cuenta)?${e.lectura&&e.lectura.coincide===false?`<br><br><b>Atención:</b> el comprobante dice ${e.lectura.monto_leido?money(e.lectura.monto_leido):'otro monto'}. Motivo: ${h(e.lectura.motivo||'')}`:e.lectura&&e.lectura.coincide?'<br>✓ El monto coincide con el comprobante.':''}`))return;
  if(!await pedirPIN('Validar pago'))return;
  await q(sb.from('qx_cirugia_evidencias').update({validado_por:S.user.nombre,validado_at:new Date().toISOString()}).eq('id',eid));
  await logA('validar_pago','qx_cirugia_evidencias',eid,{monto:e.monto});if(cid)refrescarDetalle(cid);else{await loadAll();render()}
}

async function refrescarDetalle(id){document.querySelectorAll('.modal').forEach(m=>m.remove());await loadAll();render();verCirugia(id)}
function formPago(id,tipoDef){
  const c=S.cx.find(x=>x.id===id),f=finCx(c);
  const m=modal(`${mhead('Registrar pago · '+h(c.paciente_nombre))}
  <div class="muted">Total ${money(f.total)} · pagado ${money(f.pag)} · saldo <b>${money(f.saldo)}</b></div>
  <div class="grid2"><div><label>Tipo</label><select id="gT">${[['anticipo','Anticipo'],['abono','Abono'],['liquidacion','Liquidación (salda la cuenta)'],['reembolso','Reembolso / devolución']].map(([k,t])=>`<option value="${k}" ${k===(tipoDef||(f.pag?'abono':'anticipo'))?'selected':''}>${t}</option>`).join('')}</select></div>
  <div><label>Monto</label><input id="gM" type="number" inputmode="decimal" value="${tipoDef==='liquidacion'?f.saldo:''}"></div>
  <div><label>Método</label><select id="gMe">${['Efectivo','Tarjeta','Transferencia','Depósito','Otro'].map(o=>`<option>${o}</option>`).join('')}</select></div>
  <div><label>Folio eOptics / referencia</label><input id="gF"></div></div>
  <label>Comprobante (obligatorio · se lee solo)</label><input type="file" id="gA" accept="image/*,application/pdf" capture="environment">
  <div id="gRes" class="cuadre"></div>
  <div class="acts"><button class="btn" id="ok">Guardar con PIN</button></div>`,'sm');
  const cuadre=()=>{const t=m.querySelector('#gT').value,mo=num(m.querySelector('#gM').value),sg=t==='reembolso'?-1:1,nuevo=f.pag+sg*mo,sal=f.total-nuevo;
    m.querySelector('#gRes').innerHTML=f.total?`<div class="cq"><span>Pagado</span><b>${money(f.pag)}</b></div><div class="cq"><span>${t==='reembolso'?'Devolución':'Este pago'}</span><b>${sg<0?'− ':'+ '}${money(mo)}</b></div><div class="cq tot"><span>Quedaría pagado</span><b>${money(nuevo)} de ${money(f.total)}</b></div><div class="cq ${Math.abs(sal)<=0.5?'ok':sal<0?'bad':''}"><span>${sal<-0.5?'Excede el total por':'Saldo'}</span><b>${money(Math.abs(sal))}</b></div>`:''};
  m.querySelector('#gM').addEventListener('input',cuadre);m.querySelector('#gT').addEventListener('change',()=>{if(m.querySelector('#gT').value==='liquidacion'&&!num(m.querySelector('#gM').value))m.querySelector('#gM').value=f.saldo;cuadre()});cuadre();
  ligarComprobante(m,'#gA','#gM','#gF',c.paciente_nombre);
  m.querySelector('#ok').onclick=async()=>{
    const tipo=m.querySelector('#gT').value,monto=num(m.querySelector('#gM').value),file=m.querySelector('#gA').files[0];
    if(monto<=0&&!(tipo==='liquidacion'&&f.total===0))return toast('Captura el monto',true);
    if(!file)return toast('El comprobante es obligatorio',true);
    if(tipo!=='reembolso'&&f.total>0&&f.pag+monto>f.total+0.5)return toast(`El pago excede el total por ${money(f.pag+monto-f.total)}. El saldo es ${money(f.saldo)}.`,true);
    if(tipo==='reembolso'&&monto>f.pag+0.5)return toast('La devolución no puede ser mayor a lo pagado ('+money(f.pag)+')',true);
    const lectura=await confirmarLectura(m._lect,monto);if(!lectura)return;
    if(tipo==='liquidacion'&&f.total>0&&f.pag+monto<f.total-0.5&&!await confirmar(`Con este pago quedan ${money(f.total-f.pag-monto)} pendientes. ¿Registrarlo como abono?`))return;
    if(!await pedirPIN('Registrar '+tipo+' de '+money(monto)))return;
    m.querySelector('#ok').disabled=true;
    try{const url=await subirArchivo(file,'evidencias/pagos');
      const t=tipo==='liquidacion'&&f.total>0&&f.pag+monto<f.total-0.5?'abono':tipo;
      await q(sb.from('qx_cirugia_evidencias').insert({cirugia_id:id,tipo:t,monto,metodo:m.querySelector('#gMe').value,folio:m.querySelector('#gF').value||null,url,lectura,usuario_id:S.user.id,usuario_nombre:S.user.nombre}),'Guardar pago');
      await logA('pago_'+t,'qx_cirugias',id,{monto});toast('Pago registrado: queda por comprobar');if(S.tab==='pagos'){m.remove();await loadAll();render()}else refrescarDetalle(id)}catch(e){m.querySelector('#ok').disabled=false}
  };
}
const EVID_NOM={consentimiento:'Consentimiento informado firmado',biometria:'Biometría / cálculo de LIO',valoracion:'Valoración preoperatoria / laboratorios',otro:'Documento'};
function subirEvid(id,tipo){
  const m=modal(`${mhead(EVID_NOM[tipo])}<div class="muted">Foto legible de todas las hojas o PDF del equipo.</div><input type="file" id="eA" accept="image/*,application/pdf" capture="environment" multiple style="margin-top:8px"><label>Nota</label><input id="eN"><div class="acts"><button class="btn" id="ok">Guardar con PIN</button></div>`,'sm');
  m.querySelector('#ok').onclick=async()=>{const fs=[...m.querySelector('#eA').files];if(!fs.length)return toast('Selecciona al menos un archivo',true);
    if(!await pedirPIN(EVID_NOM[tipo]))return;m.querySelector('#ok').disabled=true;
    try{for(const f of fs){const url=await subirArchivo(f,'evidencias/'+tipo);await q(sb.from('qx_cirugia_evidencias').insert({cirugia_id:id,tipo,url,nota:m.querySelector('#eN').value||null,usuario_id:S.user.id,usuario_nombre:S.user.nombre}))}
      await logA('evidencia_'+tipo,'qx_cirugias',id);refrescarDetalle(id)}catch(e){dbErr(e,'Subir');m.querySelector('#ok').disabled=false}};
}

function verificarLIO(id){
  const c=S.cx.find(x=>x.id===id),r=c.lio_requerido||{},lio=S.lios.find(l=>l.id===c.lio_unidad_id);
  const tor=r.cilindro&&num(r.cilindro)!==0,mult=r.adicion&&num(r.adicion)!==0;
  const cands=S.usuarios.filter(u=>u.activo&&u.id!==c.creado_por);
  const m=modal(`${mhead('Verificación ciega del poder del LIO')}
  <div class="muted">Una persona distinta a quien programó lee el poder <b>directamente de la biometría impresa</b> y lo captura aquí sin ver lo programado. El sistema lo compara con lo indicado y con el lente asignado.</div>
  <div class="card" style="background:var(--fondo);margin-top:8px"><b>${h(c.paciente_nombre)}</b> · ojo <b style="font-size:18px">${h(c.ojo)}</b>${evidCx(id,'biometria').length?' · biometría adjunta ✓':' · <span style="color:var(--rojo)">sin biometría adjunta</span>'}</div>
  <div class="grid3"><div><label>Dioptría</label><input id="vD" inputmode="decimal" autocomplete="off"></div>${tor?'<div><label>Cilindro</label><input id="vC" inputmode="decimal"></div><div><label>Eje</label><input id="vE" inputmode="numeric"></div>':''}${mult?'<div><label>Adición</label><input id="vA" inputmode="decimal"></div>':''}</div>
  <label>Verifica</label><select id="vU">${cands.map(u=>`<option value="${u.id}" ${u.id===S.user.id?'selected':''}>${h(u.nombre)}</option>`).join('')}</select>
  <label>PIN de quien verifica</label><input id="vP" type="password" inputmode="numeric" maxlength="4">
  <div id="vErr" class="muted" style="color:var(--rojo);margin-top:6px"></div>
  <div class="acts"><button class="btn" id="ok">Verificar</button></div>`,'sm');
  m.querySelector('#ok').onclick=async()=>{
    const err=t=>m.querySelector('#vErr').textContent=t;
    if(!cands.length)return err('Se necesita otro usuario distinto a quien programó.');
    if(!evidCx(id,'biometria').length)return err('Primero adjunta la biometría.');
    const d=num(m.querySelector('#vD').value);if(m.querySelector('#vD').value==='')return err('Captura la dioptría');
    const okD=Math.abs(d-num(r.dioptria))<0.01&&lio&&Math.abs(d-num(lio.dioptria))<0.01;
    const okC=!tor||(Math.abs(num(m.querySelector('#vC').value)-num(r.cilindro))<0.01&&String(num(m.querySelector('#vE').value))===String(num(r.eje))&&Math.abs(num(m.querySelector('#vC').value)-num(lio.cilindro))<0.01);
    const okA=!mult||Math.abs(num(m.querySelector('#vA').value)-num(r.adicion))<0.01;
    const uid=m.querySelector('#vU').value,u=S.usuarios.find(x=>x.id===uid);
    const rr=await sb.from('qx_usuarios').select('pin_hash,activo').eq('id',uid).single();
    if(!rr.data||!rr.data.activo||rr.data.pin_hash!==await pinHash(u.usuario,m.querySelector('#vP').value))return err('PIN incorrecto');
    if(!(okD&&okC&&okA)){
      await logA('lio_verificacion_fallida','qx_cirugias',id,{capturado:{d,c:m.querySelector('#vC')?.value,e:m.querySelector('#vE')?.value,a:m.querySelector('#vA')?.value},verifico:u.nombre});
      return err('⚠ NO COINCIDE con lo programado o con el lente asignado. Revisa la biometría, la indicación y el lente antes de continuar. (Quedó registrado en bitácora.)');
    }
    await q(sb.from('qx_cirugias').update({lio_verificado_por:uid,lio_verificado_nombre:u.nombre,lio_verificado_at:new Date().toISOString()}).eq('id',id));
    await logA('lio_verificado','qx_cirugias',id,{verifico:u.nombre,d});m.remove();toast('Poder del LIO verificado');refrescarDetalle(id);
  };
}
function pausaSeguridad(id){
  const c=S.cx.find(x=>x.id===id),rd=readiness(c),f=rd.f,lio=c.lio_unidad_id?S.lios.find(l=>l.id===c.lio_unidad_id):null;
  const bloq=[];
  if(c.lio_requerido&&!lio)bloq.push('No hay LIO asignado.');
  if(c.lio_requerido&&!c.lio_verificado_por)bloq.push('El poder del LIO no ha sido verificado por una segunda persona.');
  if(!evidCx(id,'consentimiento').length)bloq.push('Falta el consentimiento informado firmado.');
  if(!f.liq&&S.user.rol!=='director')bloq.push('La cirugía no está liquidada (saldo '+money(f.saldo)+'). Captura el comprobante de liquidación para dar acceso a quirófano.');
  if(!c.cotizacion_id&&!c.sin_cotizacion_autorizado_por)bloq.push('La cirugía no está vinculada a una cotización.');
  const tq=S.tanques.filter(t=>t.activo&&t.sede_id===S.sede);
  const items=[['ident',`Paciente confirma nombre completo y fecha de nacimiento: <b>${h(c.paciente_nombre)}</b>${c.fecha_nacimiento?' · '+fCorta(c.fecha_nacimiento):''}`],
    ['ojo',`Ojo / lado confirmado con el paciente, el consentimiento y marcado: <b style="font-size:20px">${h(c.ojo||'—')}</b>`],
    ['proc',`Procedimiento: <b>${h(c.procedimiento||'')}</b> · anestesia <b>${h(c.anestesia||'—')}</b>`],
    ['alerg',`Alergias revisadas: <b>${h(c.alergias||'no capturadas')}</b>`],
    ['antic',`Anticoagulantes / medicamentos revisados: <b>${h(c.anticoagulantes||'no capturados')}</b>`],
    ['equipo',`Equipo, material y gases listos${tq.length?' · '+tq.map(t=>{const l=lecturaUlt(t.id);return h(t.nombre)+' '+(l?fmtN(l.presion)+' '+h(t.unidad):'sin lectura')}).join(', '):''}`]];
  const m=modal(`${mhead('Pausa de seguridad (time-out)')}
  ${bloq.length?`<div class="card" style="border-color:var(--rojo);background:var(--rojo2)"><b>No se puede iniciar:</b><br>${bloq.map(h).join('<br>')}</div>`:''}
  ${!f.liq?`<div class="card" style="border-color:var(--amar);background:var(--amar2)"><b>Saldo pendiente: ${money(f.saldo)}</b> (${h(f.est)}). Solo Dirección General puede autorizar operar sin liquidar, con motivo.</div>`:''}
  ${items.map(([k,t])=>`<div class="sw"><input type="checkbox" class="toI" data-k="${k}" id="to_${k}"><label for="to_${k}" style="margin:0;text-transform:none;font-size:15px;color:var(--ink)">${t}</label></div>`).join('')}
  ${lio?`<div class="card" style="background:var(--fondo)"><b>Lente en mano</b><div style="font-size:18px;margin:4px 0">${h(lio.marca||'')} ${h(lio.modelo)} · <b>${fmtN(lio.dioptria)} D</b>${lio.cilindro?' Cil '+fmtN(lio.cilindro)+' Eje '+h(c.lio_requerido?.eje||''):''}</div><label>Foto de la caja del lente (que se lean poder y serie)</label><input type="file" id="toF" accept="image/*" capture="environment" onchange="const i=this.closest('.box').querySelector('#toPrev');if(this.files[0]){i.src=window.URL.createObjectURL(this.files[0]);i.style.display='block'}"><img id="toPrev" style="display:none;max-width:220px;border-radius:8px;margin-top:8px"><label>Serie (opcional, el sistema la coteja)</label><input id="toS" autocomplete="off"></div>`:''}
  <div class="acts"><button class="btn sec" onclick="closeModal(this.closest('.modal'))">Cancelar</button><button class="btn azul" id="ok" ${bloq.length?'disabled':''}>Confirmar e iniciar</button></div>`);
  m.dataset.lock=1;
  m.querySelector('#ok').onclick=async()=>{
    if([...m.querySelectorAll('.toI')].some(x=>!x.checked))return toast('Marca todos los puntos de la pausa de seguridad',true);
    if(lio){const s0=(m.querySelector('#toS').value||'').trim().toUpperCase();
      const rsp=c.lio_respaldo_id?S.lios.find(l=>l.id===c.lio_respaldo_id):null;
      if(s0&&lio.serie&&s0!==String(lio.serie).trim().toUpperCase()){
        if(rsp&&rsp.serie&&s0===String(rsp.serie).trim().toUpperCase()){if(!await confirmar(`Esa serie es del <b>LIO de respaldo</b> (${h(rsp.modelo)} ${fmtN(rsp.dioptria)} D). ¿Se usará el respaldo?`))return}
        else return toast('La serie no coincide con el lente asignado ni con el respaldo. NO continuar: verifica el lente.',true)}
      if(!m.querySelector('#toF').files[0])return toast('Toma la foto de la caja del lente',true)}
    let override=null;
    if(!f.liq){
      if(S.user.rol!=='director')return toast('La cirugía no está liquidada. Captura la liquidación.',true);
      const mot=await pedirTexto('Operar con saldo pendiente','Motivo y cómo se cubrirá el saldo de '+money(f.saldo));if(!mot)return;
      override={nombre:S.user.nombre,motivo:mot,saldo:f.saldo};
    }
    if(!await pedirPIN((override?'AUTORIZO operar con saldo · ':'Pausa de seguridad · ')+c.paciente_nombre))return;
    let fotoCaja=null;
    if(lio){try{toast('Subiendo foto…');fotoCaja=await subirArchivo(m.querySelector('#toF').files[0],'evidencias/lio_caja');await q(sb.from('qx_cirugia_evidencias').insert({cirugia_id:id,tipo:'lio_caja',url:fotoCaja,nota:'Caja del LIO en la pausa de seguridad',usuario_id:S.user.id,usuario_nombre:S.user.nombre}))}catch(e){return dbErr(e,'Foto de la caja')}}
    const to={nombre:S.user.nombre,usuario_id:S.user.id,at:new Date().toISOString(),items:items.map(x=>x[0]),serie:lio?m.querySelector('#toS').value.trim():null,foto_caja:fotoCaja,override};
    await q(sb.from('qx_cirugias').update({timeout:to,estado:'en_curso'}).eq('id',id),'Pausa de seguridad');
    await logA('pausa_seguridad','qx_cirugias',id,{override:!!override});
    m.remove();toast('Pausa de seguridad registrada');await loadAll();render();verCirugia(id);
  };
}

                partidas:[{tipo:'LIO_CONSIGNACION',lio_unidad_id:lio.id,descripcion:`${lio.modelo} ${fmtN(lio.dioptria)} D`,serie:lio.serie,cantidad:1,unidad:'pza',costo:num(lio.costo)}],

            }

        }
        await q(sb.from('qx_cirugias').update({lio_implantado_id:impl?selL:null,consumo_cerrado:true,estado:'realizada',cerrado_por:S.user.id,cerrado_at:new Date().toISOString(),notas:[c.notas,nota].filter(Boolean).join('\n')}).eq('id',id));
        await logA('cerrar_consumo','qx_cirugias',id,{items:items.length,lio_implantado:impl});
        m.remove();toast('Consumo registrado');await loadAll();render();
      }catch(e){}
    };
  };draw();
}

      ${mats.filter(m=>(m.categoria||'General')===cat).map(m=>{const sm=semaforo(m),stv=stockMat(m.id,uSet);const cad=S.lotes.filter(l=>l.material_id===m.id&&uSet.has(l.ubicacion_id)&&num(l.cantidad)>0&&l.caducidad).sort((a,b)=>a.caducidad<b.caducidad?-1:1)[0];const dc=cad?diasHasta(cad.caducidad):null;

}

/* ============================================================
   ALMACÉN DE ADMINISTRACIÓN → QUIRÓFANO
   Llegan los pedidos a Administración (lote, caducidad, cantidad) y de ahí
   se envían a quirófano con firma de quien entrega y de quien recibe.
   ============================================================ */
function stockAdm(mid){const a=ubicAdm();return a?S.lotes.filter(l=>l.material_id===mid&&l.ubicacion_id===a.id).reduce((s,l)=>s+num(l.cantidad),0):0}
function sugeridoEnvio(m){const st=semaforo(m).st,min=num(m.stock_minimo),max=num(m.stock_maximo)||min*2;return Math.max(0,Math.min(stockAdm(m.id),Math.ceil(max-st)))}
function vAlmacenAdm(){
  const a=ubicAdm();if(!a)return '<div class="card empty">No hay almacén de Administración en esta sede.</div>';
  const lotes=S.lotes.filter(l=>l.ubicacion_id===a.id&&num(l.cantidad)>0);

const matEtq=m=>m.nombre+(m.codigo?' · '+m.codigo:'');
function matDeEtq(v){v=String(v||'').trim();if(!v)return null;const l=matsQX();return l.find(m=>matEtq(m)===v)||l.find(m=>m.codigo&&m.codigo.toUpperCase()===v.toUpperCase())||l.find(m=>normTxt(m.nombre)===normTxt(v))||null}
function matPorTexto(linea){const t=normTxt(linea).replace(/,/g,'.');const tnums=new Set((t.match(/\d+(?:\.\d+)?/g)||[]));let best=null,bs=0;
  for(const m of matsQX()){if(m.codigo&&new RegExp('\\b'+normTxt(m.codigo)+'\\b').test(t))return m;
    const n=normTxt(m.nombre).replace(/,/g,'.');const nnums=(n.match(/\d+(?:\.\d+)?/g)||[]);
    if(nnums.length&&!nnums.every(x=>tnums.has(x)))continue;
    const ws=n.split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!/^\d/.test(w)&&!['para','con','sin','esteril','esteriles'].includes(w));if(!ws.length)continue;
    const uni=nnums.filter(x=>{const u=(n.split(x)[1]||'').trim().split(/[^a-z]+/)[0];return u&&new RegExp('(^|[^0-9.])'+x.replace('.','\\.')+'\\s*'+u).test(t)}).length;
    const s=ws.filter(w=>t.includes(w)).length/ws.length+(nnums.length?0.2:0)+uni*0.3;if(s>bs){bs=s;best=m}}
  return bs>=0.6?best:null}
function analizarRemision(txt){
  const out=[];const lineas=String(txt||'').split(/\n+/).map(x=>x.trim()).filter(x=>x.length>3);
  lineas.forEach((ln,i)=>{const m=matPorTexto(ln);if(!m)return;const ctx=/(lote|lot|cad|exp|20\d\d|\d{1,2}[\/\-.]\d{2,4})/i.test(ln)?ln:ln+' '+(lineas[i+1]||'');
    const lote=(ctx.match(/\b(?:lote|lot|l\.)\s*[:#.]?\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i)||[])[1]||'';
    let cad='';const f1=ctx.match(/\b(20\d\d)[\/\-.](\d{1,2})(?:[\/\-.](\d{1,2}))?/),f2=ctx.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d\d|\d\d)\b/),f3=ctx.match(/\b(?:cad|exp|caducidad|vence)[^0-9]{0,6}(\d{1,2})[\/\-.](\d{2,4})\b/i);
    const fin=(y,mm)=>{y=+y;if(y<100)y+=2000;mm=+mm;if(!(mm>=1&&mm<=12))return '';const d=new Date(y,mm,0).getDate();return `${y}-${pad(mm)}-${pad(d)}`};
    if(f3)cad=fin(f3[2],f3[1]);else if(f1)cad=f1[3]?`${f1[1]}-${pad(+f1[2])}-${pad(+f1[3])}`:fin(f1[1],f1[2]);else if(f2)cad=fin(f2[3],f2[2]);
    const nums=(ln.match(/\b\d{1,4}\b/g)||[]).map(Number).filter(n=>n>0&&n<5000);const cant=(ln.match(/^\s*(\d{1,4})\b/)||[])[1]||(ln.match(/(?:cant|cantidad|pzas?|piezas|unid)[^0-9]{0,4}(\d{1,4})/i)||[])[1]||(nums.length===1?nums[0]:'');
    if(!out.some(o=>o.m.id===m.id&&o.lote===lote))out.push({m,c:cant,lote,cad})});
  return out}

  const info=()=>{const mid=m.querySelector('#tM').value,o=m.querySelector('#tO').value;m.querySelector('#tInfo').textContent=mid?'Disponible en origen: '+fmtN(stockUbic(mid,o)):''};
  m.querySelector('#tM').onchange=info;m.querySelector('#tO').onchange=info;
  m.querySelector('#ok').onclick=async()=>{
    const mid=m.querySelector('#tM').value,o=m.querySelector('#tO').value,d=m.querySelector('#tD').value,c=num(m.querySelector('#tC').value);
    if(!mid||c<=0||o===d)return toast('Revisa material, cantidad y ubicaciones',true);

    if(!await pedirPIN('Traspaso de '+matById(mid).nombre))return;
    try{
      let resto=c;const lotes=S.lotes.filter(l=>l.material_id===mid&&l.ubicacion_id===o&&num(l.cantidad)>0).sort((a,b)=>(a.caducidad||'9')<(b.caducidad||'9')?-1:1);
      for(const l of lotes){if(resto<=0)break;const t=Math.min(resto,num(l.cantidad));
        await q(sb.from('qx_lotes').update({cantidad:num(l.cantidad)-t}).eq('id',l.id));l.cantidad=num(l.cantidad)-t;
        await q(sb.from('qx_movimientos').insert({tipo:'traspaso_sal',material_id:mid,lote_id:l.id,ubicacion_id:o,cantidad:-t,usuario_id:S.user.id,usuario_nombre:S.user.nombre,nota:'A '+ubicById(d).nombre}));
        await ingresar(mid,d,l.lote,l.caducidad,t,{tipo:'traspaso_ent',nota:'De '+ubicById(o).nombre});resto-=t}
      m.remove();toast('Traspaso realizado');await loadAll();render()}catch(e){}
  };
}

  const est={abierto:['p-azul','Contando','Continuar','abrirConteo'],reconteo:['p-morado','Falta 2º conteo','Recontar (2ª persona)','reconteo'],enviado:['p-amar','Por revisar','Revisar','revisarConteo']};
  return `  ${vencidos.map(v=>`<div class="pill ${v.ev.st==='hoy'?'p-amar':'p-rojo'}" style="margin-bottom:6px">${v.nom}: ${v.ev.txt}</div>`).join(' ')}
  ${can.inventario()?`<div class="row" style="margin:10px 0"><button class="btn" onclick="nuevoConteo('criticos')">Contar críticos</button><button class="btn" onclick="nuevoConteo('completo')">Inventario completo</button><button class="btn sec" onclick="imprimirEtiquetas('quirofano')">Etiquetas QR</button></div>`:''}
  <div class="sec-t">En proceso / por revisar</div>${abiertos.map(c=>{const e=est[c.estado];return `<div class="list-item"><div class="grow"><b>${TIPO_CONTEO[c.tipo]||c.tipo}</b> · ${h(ubicById(c.ubicacion_id)?.nombre)}<div class="muted">${fDT(c.created_at)} · ${h(c.creado_nombre||'')}</div></div><span class="pill ${e[0]}">${e[1]}</span><button class="btn sm" onclick="${e[3]}('${c.id}')">${e[2]}</button></div>`}).join('')||'<div class="muted">Ninguno</div>'}
  <div class="sec-t">Historial</div>${hechos.map(c=>`<div class="list-item"><div class="grow">${TIPO_CONTEO[c.tipo]||c.tipo} · ${h(ubicById(c.ubicacion_id)?.nombre)}<div class="muted">${fDT(c.created_at)} · contó ${h(c.creado_nombre||'')}${c.reconteo_nombre?' · recontó '+h(c.reconteo_nombre):''} · ${c.estado} por ${h(c.aprobado_nombre||'')}${c.precision!=null?' · precisión '+c.precision+'%':''}</div></div><button class="btn sec sm" onclick="revisarConteo('${c.id}',true)">Ver</button></div>`).join('')||'<div class="muted">Sin conteos</div>'}<details class="card"><summary><b>¿Cómo se evidencia el conteo?</b></summary><div class="muted" style="line-height:1.6">
   1. <b>Ciego</b>: quien cuenta no ve la existencia del sistema.<br>
   2. <b>Por gaveta y con etiqueta QR</b>: la lista sigue el orden del anaquel; escanea la etiqueta y el sistema te lleva al material.<br>
   3. <b>Cajas cerradas + piezas sueltas</b>: no se cuentan piezas una por una; el sistema multiplica.<br>
   4. <b>Foto de cada gaveta</b> antes de cerrar: queda como evidencia.<br>
   5. <b>Doble conteo solo en diferencias</b>: si algo no cuadra, una segunda persona (con su PIN) lo recuenta sin ver cifras. Si su conteo coincide con el sistema, fue error de conteo y no se ajusta.<br>
   6. Dirección aprueba el ajuste con PIN. Semanal: críticos (${cfg('freq_criticos',7)} días) · Completo: cada ${cfg('freq_completo',15)} días.</div></details>`;
}
const TIPO_CONTEO={criticos:'Críticos',completo:'Completo',carro:'Carro rojo'};
async function nuevoConteo(tipo){
  const go=async uid=>{
    const c=(await q(sb.from('qx_conteos').insert({ubicacion_id:uid,tipo,creado_por:S.user.id,creado_nombre:S.user.nombre}).select()))[0];
    const mats=(tipo==='carro'?matsCarro():matsQX().filter(x=>tipo==='completo'||critOf(x)==='critico'));
    const rows=mats.map(x=>({conteo_id:c.id,material_id:x.id,esperado:stockUbic(x.id,uid)}));

  <div class="row" style="margin:8px 0;gap:8px"><input placeholder="Buscar…" id="cQ"><button class="btn sec" style="flex:0 0 auto" id="cScan">▦ Leer QR (cámara o foto)</button></div>

  <input type="file" id="cFoto" accept="image/*" capture="environment" style="display:none">
  <div class="acts"><button class="btn sec" onclick="closeModal(this.closest('.modal'))">Guardar y salir</button><button class="btn" id="env">Terminar conteo</button></div>`);
  const prog=()=>{const t=m.querySelectorAll('.cnt').length,ll=[...m.querySelectorAll('.cnt')].filter(r=>{const a=r.querySelector('.qty');return a?a.value!=='':(r.querySelector('.qc').value!==''||r.querySelector('.qs').value!=='')}).length;

    const r=[...gv.querySelectorAll('.cnt')].find(x=>x.dataset.cod&&cod.toUpperCase().includes(x.dataset.cod.toUpperCase()));if(!r)return toast('Ese material no está en esta gaveta',true);const it=r.closest('.list-item');it.scrollIntoView({behavior:'smooth',block:'center'});it.classList.add('flash');setTimeout(()=>it.classList.remove('flash'),1600);(it.querySelector('.qc')||it.querySelector('.qty'))?.focus()})});
  m.querySelector('#cScan').onclick=()=>escanear(cod=>{if(/^GAV:/i.test(cod)){const g=[...m.querySelectorAll('.gav')].find(x=>x.dataset.g===cod.slice(4));if(!g)return toast('Esa gaveta no está en este conteo',true);m.querySelector('#cQ').value='';m.querySelectorAll('#cL .list-item').forEach(x=>x.style.display='');g.scrollIntoView({behavior:'smooth',block:'start'});g.classList.add('flash');setTimeout(()=>g.classList.remove('flash'),1600);return}const r=[...m.querySelectorAll('.cnt')].find(x=>x.dataset.cod&&cod.toUpperCase().includes(x.dataset.cod.toUpperCase()));

/* ----- escaneo de etiquetas (cámara del celular) ----- */
/* lector de QR: cámara en vivo (BarcodeDetector o jsQR) o foto de la etiqueta; funciona en iPhone/iPad */
const JSQR_URL='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
function qrDeCanvas(cv){const d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height);const r=window.jsQR&&jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});return r?r.data:null}
async function qrDeFoto(file){await cargarScript(JSQR_URL);const img=await createImageBitmap(file);
  for(const max of [1400,900,2000]){const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);const r=qrDeCanvas(cv);if(r)return r}
  if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code','code_128','ean_13']}).detect(img);if(r.length)return r[0].rawValue}catch(e){}}
  return null}
async function escanear(cb){
  const m=modal(`${mhead('Leer QR de la etiqueta')}<video id="scV" playsinline muted style="width:100%;border-radius:12px;background:#000;display:none"></video><canvas id="scC" style="display:none"></canvas>
   <div class="muted" id="scI" style="margin:6px 0">Apunta la cámara a la etiqueta, o toma una foto del QR.</div>
   <div class="acts" style="flex-wrap:wrap"><label class="btn" style="flex:1;text-align:center;cursor:pointer">📷 Tomar foto del QR<input type="file" id="scF" accept="image/*" capture="environment" style="display:none"></label><button class="btn sec" id="scT" style="flex:1">Escribir código</button></div>`,'sm');
  let stream=null,on=true;const fin=v=>{on=false;if(stream)stream.getTracks().forEach(t=>t.stop());m.remove();if(v)cb(String(v).trim())};
  m.querySelector('.x').onclick=()=>fin(null);
  m.querySelector('#scT').onclick=async()=>{const v=await pedirTexto('Código de la etiqueta','Escribe el código impreso (p. ej. QX-012 o GAV:Oftalmo A)');if(v)fin(v)};
  m.querySelector('#scF').onchange=async e=>{const f=e.target.files[0];if(!f)return;m.querySelector('#scI').textContent='Leyendo la foto…';
    try{const r=await qrDeFoto(f);if(r)return fin(r);m.querySelector('#scI').textContent='No se encontró un QR en la foto. Acércate más, con buena luz y sin reflejo, e inténtalo de nuevo.'}catch(err){m.querySelector('#scI').textContent='No se pudo leer la foto.'}};
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){m.querySelector('#scI').textContent='La cámara en vivo no está disponible: usa “Tomar foto del QR”.';return}
  const v=m.querySelector('#scV'),cv=m.querySelector('#scC');v.style.display='';v.srcObject=stream;try{await v.play()}catch(e){}
  let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code','code_128','ean_13']})}catch(e){}}
  if(!det){try{await cargarScript(JSQR_URL)}catch(e){}}
  const loop=async()=>{if(!on)return;try{
      if(det){const r=await det.detect(v);if(r.length)return fin(r[0].rawValue)}
      else if(window.jsQR&&v.videoWidth){const k=Math.min(1,720/v.videoWidth);cv.width=v.videoWidth*k|0;cv.height=v.videoHeight*k|0;cv.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height);const r=qrDeCanvas(cv);if(r)return fin(r)}
    }catch(e){}setTimeout(()=>requestAnimationFrame(loop),120)};loop();
}

async function imprimirEtiquetas(area,modo){
  if(!modo){const m=modal(`${mhead('Etiquetas QR')}<div class="muted">Por gaveta: una etiqueta por cajón o anaquel con su lista; al escanearla te lleva a esa gaveta en el conteo. Es lo práctico cuando hay mucho material.</div><div class="acts"><button class="btn sec" id="eM">Por material (críticos)</button><button class="btn" id="eG">Por gaveta</button></div>`,'sm');m.querySelector('#eG').onclick=()=>{m.remove();imprimirEtiquetas(area,'gaveta')};m.querySelector('#eM').onclick=()=>{m.remove();imprimirEtiquetas(area,'material')};return}
  if(modo==='gaveta'){const ms=(area==='carro_rojo'?matsCarro():matsQX());const gs=[...new Set(ms.map(gavetaDe))].sort();toast('Generando etiquetas…');const et=[];for(const g of gs){const l=ms.filter(m=>gavetaDe(m)===g);et.push(`<div class="etq etg"><img src="${await qrURL('GAV:'+g)}"><div><b>${h(g)}</b><span>${l.length} materiales · ${l.filter(m=>critOf(m)==='critico').length} críticos</span><span class="etl">${l.map(m=>h(m.nombre)).join(' · ')}</span></div></div>`)}
    return printWin(`${printHead('Etiquetas por gaveta · '+(area==='carro_rojo'?'Carro rojo':'Quirófano'))}<div class="etqs" style="grid-template-columns:repeat(2,1fr)">${et.join('')}</div>`)}
  const mats=(area==='carro_rojo'?matsCarro():matsQX().filter(m=>critOf(m)==='critico')).sort((a,b)=>gavetaDe(a).localeCompare(gavetaDe(b))||a.nombre.localeCompare(b.nombre));
  const sinCod=mats.filter(m=>!m.codigo);
  if(sinCod.length&&can.catalogo()){for(const m of sinCod){m.codigo=(area==='carro_rojo'?'CR-':'QX-')+m.id.slice(0,6).toUpperCase();await sb.from('qx_materiales').update({codigo:m.codigo}).eq('id',m.id)}}
  toast('Generando etiquetas…');
  const et=[];for(const m of mats)et.push(`<div class="etq"><img src="${await qrURL(m.codigo||m.id)}"><div><b>${h(m.nombre)}</b><span>${h(m.codigo||'')} · ${h(gavetaDe(m))}</span><span>Mín ${fmtN(m.stock_minimo)} ${h(m.unidad)}${num(m.pzas_presentacion)>1?' · caja '+fmtN(m.pzas_presentacion):''}</span>${critOf(m)==='critico'?'<i>CRÍTICO</i>':''}</div></div>`);
  printWin(`${printHead('Etiquetas de inventario · '+(area==='carro_rojo'?'Carro rojo':'Quirófano'))}<div class="muted noprint" style="margin-bottom:8px">Pega cada etiqueta en el frente de su gaveta o caja. Al contar, escanéala desde el celular.</div><div class="etqs">${et.join('')}</div>`);
}

   ============================================================ */
const avisoCarro=()=>num(cfg('carro_aviso_dias',180))||180;
function carroLotes(mid){const cu=carroUb();return cu?S.lotes.filter(l=>l.material_id===mid&&l.ubicacion_id===cu.id&&num(l.cantidad)>0).sort((a,b)=>(a.caducidad||'9')<(b.caducidad||'9')?-1:1):[]}
function carroEstado(m){
  const ls=carroLotes(m.id),st=ls.reduce((a,l)=>a+num(l.cantidad),0),min=num(m.stock_minimo);
  const venc=ls.filter(l=>l.caducidad&&diasHasta(l.caducidad)<0),camb=ls.filter(l=>l.caducidad&&diasHasta(l.caducidad)>=0&&diasHasta(l.caducidad)<=avisoCarro());
  const vig=st-venc.reduce((a,l)=>a+num(l.cantidad),0);
  const nivel=min>0&&vig<=0?'falta':vig<min?'bajo':'ok';
  return {ls,st,vig,min,venc,camb,nivel}
}
function carroResumen(){
  const e=matsCarro().map(m=>({m,...carroEstado(m)}));
  const falt=e.filter(x=>x.nivel!=='ok'),venc=e.filter(x=>x.venc.length),camb=e.filter(x=>x.camb.length&&!x.venc.length);
  const revs=S.carroRev.filter(r=>!r.sede_id||r.sede_id===S.sede);
  const ult=revs[0],ultSello=revs.find(r=>r.sello_nuevo);
  const ultRev=revs.find(r=>r.tipo!=='uso');
  const dRev=ultRev?Math.floor((Date.now()-new Date(ultRev.created_at))/864e5):null;
  const revVencida=!!e.length&&!!carroUb()&&(dRev==null||dRev>=num(cfg('carro_rev_dias',7)));
  const selloRoto=!!ult&&ult.tipo==='uso';
  return {e,falt,venc,camb,ult,ultSello,ultRev,dRev,revVencida,selloRoto,alerta:carroUb()?e.filter(x=>(x.nivel!=='ok'&&critOf(x.m)==='critico')||x.venc.length).length+(revVencida?1:0)+(selloRoto?1:0):0}
}

function medInfo(nombre){const ls=String(cfg('medicos_cedulas','Dr. José Antonio Villegas Ávila|7256707|9457035')).split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(l=>l[0]);
  const n=normTxt(nombre||'');const f=ls.find(l=>normTxt(l[0]).split(/\s+/).filter(w=>w.length>3&&!/^(dr|dra)\.?$/.test(w)).some(w=>n.includes(w)))||(!nombre?ls[0]:null);
  return f?{nombre:f[0],ced:f[1]||'',esp:f[2]||''}:{nombre:nombre||'',ced:'',esp:''}}
const docsCons=c=>/sin anestesia/i.test(c.anestesia||'')?['cons']:['cons','consan'];
function consentimientoCx(id){const c=S.cx.find(x=>x.id===id);imprimirPapeleria(c,c.checklist?.papeleria||{},docsCons(c))}
function consentimientoCot(id){
  const cot=(S.cots||[]).find(x=>x.id===id)||(S.cotsDash||[]).find(x=>x.id===id);if(!cot)return toast('No encontré la cotización',true);
  const its=(cot.items||[]).filter(i=>i.categoria==='cirugia'||i.categoria==='laser');
  const imp=it=>{const oj=(it.ojos||[]);const o=oj.length===2?'AO':(oj[0]||'');const l=oj.map(x=>it.lio?.[x]).find(Boolean);
    const c={id:'cot-'+cot.id,paciente_nombre:cot.paciente_nombre,expediente:cot.expediente,telefono:[cot.telefono1,cot.telefono2].filter(Boolean).join(' / '),
      fecha:null,hora:null,sala_id:null,procedimiento:it.nombre,ojo:o,cirujano:cot.medico||'',anestesia:cot.anestesia==='No'?'Sin anestesia':cot.anestesia==='Sí'?'':(cot.anestesia||''),
      lio_requerido:l?{tipo:normTipo(l.nombre)||l.nombre||'',modelo:'',dioptria:(l.poder||'').toString(),cilindro:'',eje:'',adicion:''}:null,checklist:{}};
    imprimirPapeleria(c,{},docsCons(c))};
  if(its.length<=1)return its[0]?imp(its[0]):toast('La cotización no tiene cirugía',true);
  const m=modal(`${mhead('¿Para qué procedimiento?')}${its.map((it,k)=>`<button class="btn sec" style="width:100%;margin-bottom:6px" data-k="${k}">${h(it.nombre)} · ${(it.ojos||[]).join(' y ')||'—'}</button>`).join('')}`,'sm');
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{m.remove();imp(its[+b.dataset.k])})}
function papeleriaCx(id){
  const c=S.cx.find(x=>x.id===id),pp=c.checklist?.papeleria||{};
  const m=modal(`${mhead('Papelería quirúrgica')}<div class="muted">Se llena con los datos del paciente, la clínica y el cirujano. Lo que falte se completa a mano.</div>
  <div class="grid2"><div><label>Anestesiólogo</label><input id="ppA" value="${h(pp.anest||cfg('anestesiologo',''))}"></div><div><label>Ayudante</label><input id="ppY" value="${h(pp.ayud||'')}"></div>
  <div><label>Instrumentista</label><input id="ppI" value="${h(pp.instr||'')}"></div><div><label>Circulante</label><input id="ppC" value="${h(pp.circ||'')}"></div>
  <div><label>Sexo</label><select id="ppS"><option value="">—</option>${['Femenino','Masculino'].map(x=>`<option ${pp.sexo===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Diagnóstico preoperatorio</label><input id="ppD" value="${h(pp.dx||'')}" placeholder="Ej. Catarata senil ${h(c.ojo||'')}"></div></div>
  <div class="sec-t">Documentos</div><div class="chkgrid">${DOCS_QX.map(([k,t,cod])=>`<label class="chk"><input type="checkbox" class="ppK" value="${k}" ${k==='cons'||k==='consan'?(pp.cons===false?'':'checked'):'checked'}>${t}</label>`).join('')}</div>
  <div class="acts"><button class="btn" id="ok">Generar e imprimir</button></div>`);
  m.querySelector('#ok').onclick=async()=>{const g=s=>m.querySelector(s).value.trim();
    const d={anest:g('#ppA'),ayud:g('#ppY'),instr:g('#ppI'),circ:g('#ppC'),sexo:g('#ppS'),dx:g('#ppD')};const ks=[...m.querySelectorAll('.ppK:checked')].map(x=>x.value);
    if(!ks.length)return toast('Elige al menos un documento',true);
    try{await setChecklist(id,'papeleria',{...d,cons:ks.includes('cons')})}catch(e){}
    imprimirPapeleria(c,d,ks)};
}
/* Contenido de consentimiento por procedimiento. Cada bloque: qué es, para qué, alternativas, riesgos frecuentes, riesgos poco frecuentes pero graves, qué pasa si no se opera. */
const CONS_PROC=[
 [/iridotom/i,null,'iridotomia','Iridotomía con láser: se hace un pequeño orificio en el iris para mejorar el paso del líquido del ojo.','Prevenir o tratar el glaucoma por ángulo cerrado.','Gotas, observación o cirugía de cristalino.',['Molestia y visión borrosa unas horas','Aumento temporal de la presión','Pequeño sangrado del iris'],['Visión de una línea de luz o reflejos','Inflamación','Necesidad de repetir el láser','Catarata'],'Riesgo de un ataque agudo de glaucoma con dolor intenso y pérdida de visión.'],
 [/yag|capsulot/i,null,'yag_cap','Capsulotomía con láser YAG: con el láser se abre la cápsula posterior que se opacó después de la cirugía de catarata. No requiere cortes.','Recuperar la visión clara que se perdió por la opacidad de la cápsula.','Observación.',['Moscas volantes temporales','Aumento temporal de la presión del ojo','Inflamación leve'],['Desprendimiento de retina','Edema de la mácula','Marcas o desplazamiento del lente intraocular'],'La visión sigue borrosa por la opacidad.'],
 [/slt|trabeculoplast/i,null,'slt','Trabeculoplastia selectiva con láser (SLT): se aplica láser a la malla de drenaje del ojo para que salga mejor el líquido.','Bajar la presión del ojo y reducir o evitar gotas.','Gotas o cirugía de glaucoma.',['Molestia y ojo rojo leves','Aumento temporal de la presión'],['Inflamación','Efecto insuficiente o que se pierde con el tiempo'],'La presión puede seguir alta y avanzar el daño por glaucoma.'],
 [/fotocoag|panfoto|focal|rejilla|retinopexia con l|barrera/i,null,'laser_ret','Láser de retina (fotocoagulación): se aplican disparos de láser en la retina para sellar desgarros, tratar zonas sin circulación o edema.','Frenar el avance de la enfermedad de la retina (por ejemplo diabética) o prevenir un desprendimiento. Su objetivo es conservar la visión, no mejorarla.','Inyecciones intravítreas, cirugía u observación, según el diagnóstico.',['Molestia o dolor durante la sesión','Visión borrosa temporal','Pueden requerirse varias sesiones'],['Disminución de la visión periférica o nocturna','Edema de la mácula','Manchas en la visión','Sangrado'],'La enfermedad puede avanzar con sangrados, desprendimiento de retina y pérdida de la visión.'],
 [/vitrect/i,/fac+o|catarat/i,'faco_vit','Cirugía combinada: se retira la catarata (facoemulsificación con implante de lente intraocular) y en el mismo tiempo se realiza vitrectomía: se retira el gel vítreo para tratar la enfermedad de la retina, y puede incluir láser, gas o aceite de silicón dentro del ojo.','Aclarar el cristalino opaco y tratar la enfermedad de la retina para conservar o mejorar la visión.','Operar en dos tiempos (primero catarata y después retina), tratamiento con láser o inyecciones según el caso, u observación.',['Inflamación, dolor leve, ojo rojo y visión borrosa las primeras semanas','Aumento de la presión del ojo','Posición especial de la cabeza varios días si se usa gas o aceite (no viajar en avión ni subir a la sierra con gas en el ojo)','Opacidad de la cápsula posterior que después se trata con láser YAG'],['Infección grave dentro del ojo (endoftalmitis)','Sangrado dentro del ojo','Nuevo desprendimiento de retina o necesidad de otra cirugía (incluido el retiro de aceite de silicón)','Edema de córnea o de mácula','Ruptura de cápsula o lente desplazado','Pérdida parcial o total de la visión'],'La enfermedad de la retina y la catarata pueden avanzar con pérdida progresiva y a veces permanente de la visión.'],
 [/trabeculect|facotrab|ahmed|valvula|válvula|glaucoma/i,null,'glaucoma','Cirugía de glaucoma: se crea una nueva vía de salida para el líquido del ojo (trabeculectomía) o se coloca un dispositivo de drenaje (válvula), con el fin de bajar la presión intraocular. Si se combina con catarata, también se retira el cristalino y se implanta un lente intraocular.','Bajar la presión del ojo para detener o frenar el daño del nervio óptico. La visión que ya se perdió por glaucoma no se recupera.','Gotas para bajar la presión, láser (trabeculoplastia SLT o iridotomía) o seguimiento con estudios.',['Molestia, ojo rojo y visión borrosa temporal','Presión demasiado baja o demasiado alta en las primeras semanas','Necesidad de ajustes en consulta (retiro de puntos, masaje, inyecciones o láser)','Avance de catarata'],['Infección del ojo, incluso años después (blebitis o endoftalmitis)','Sangrado dentro del ojo','Desprendimiento de coroides','Falla de la cirugía con necesidad de reoperar o de seguir usando gotas','Exposición o falla de la válvula','Pérdida de visión'],'El glaucoma sin control sigue dañando el nervio óptico y puede llevar a ceguera irreversible.'],
 [/catarat|fac+o|eecc|msics|extracapsular|lio|lente intraocular|fijaci/i,null,'catarata','Cirugía de catarata: se retira el cristalino opaco (por facoemulsificación con ultrasonido o por extracción extracapsular) y se coloca un lente intraocular (LIO) cuyo poder se calcula con la biometría. En el implante secundario se coloca un lente en un ojo que no lo tiene o se recoloca un lente desplazado.','Mejorar la visión al quitar la opacidad del cristalino. El resultado final depende también del estado de la córnea, la retina y el nervio óptico.','Seguir con lentes o graduación mientras la catarata lo permita, u observación. No existe tratamiento con gotas o medicamentos que quite la catarata.',['Ojo rojo, lagrimeo, sensación de arena y visión borrosa los primeros días','Inflamación que se controla con gotas','Aumento temporal de la presión del ojo','Necesidad de lentes para cerca o lejos después de la cirugía (resultado refractivo distinto al calculado)','Opacidad de la cápsula posterior meses o años después, que se trata con láser YAG'],['Infección grave dentro del ojo (endoftalmitis)','Ruptura de la cápsula, caída de fragmentos de cristalino o del lente a la cavidad vítrea, que puede requerir otra cirugía','Edema de córnea persistente','Edema de la mácula','Desprendimiento de retina','Hemorragia','Pérdida parcial o total de la visión'],'La catarata sigue opacándose y la visión baja cada vez más; en etapas avanzadas la cirugía es más difícil y puede causar inflamación o glaucoma.'],
 [/retir\w*.*silic/i,null,'silicon','Retiro de aceite de silicón: mediante vitrectomía se extrae el aceite que se colocó en una cirugía previa de retina y se sustituye por solución o gas.','Retirar el aceite cuando la retina ya está estable, para evitar sus complicaciones (presión alta, daño a la córnea, catarata).','Dejar el aceite por más tiempo bajo vigilancia.',['Molestia, ojo rojo y visión borrosa temporal','Cambio de graduación','Aumento de la presión del ojo','Restos de aceite que requieran otro lavado'],['Nuevo desprendimiento de retina','Sangrado dentro del ojo','Infección grave (endoftalmitis)','Pérdida de visión'],'El aceite puede causar glaucoma, catarata o daño a la córnea si permanece mucho tiempo.'],
 [/vitrect|retina|retinopexia|cerclaje|macular|epirret/i,null,'retina','Cirugía de retina: vitrectomía (retiro del gel vítreo) y, según el caso, pelado de membranas, láser, crioterapia, cerclaje escleral (banda alrededor del ojo) y colocación de gas o aceite de silicón para sostener la retina.','Reaplicar la retina o tratar la enfermedad de la mácula o del vítreo para conservar o mejorar la visión.','Láser, crioterapia, neumorretinopexia, inyecciones intravítreas u observación, según el diagnóstico.',['Dolor, ojo rojo, párpados hinchados y visión muy borrosa las primeras semanas','Posición especial de la cabeza varios días si se usa gas o aceite (no viajar en avión ni subir a zonas altas con gas en el ojo)','Aumento de la presión del ojo','Avance de catarata','Cambio de graduación, especialmente con cerclaje'],['Nuevo desprendimiento de retina o proliferación que requiera otra cirugía','Sangrado dentro del ojo','Infección grave (endoftalmitis)','Visión doble','Falla en recuperar la visión','Pérdida de la visión o del ojo'],'Un desprendimiento de retina o una hemorragia sin tratar puede llevar a pérdida permanente de la visión.'],
 [/intravitre|inyecci|antiangio|anti-?vegf/i,null,'iv','Inyección intravítrea: con anestesia en gotas y lavado con iodopovidona, se aplica un medicamento (antiangiogénico, esteroide u otro) dentro del ojo con una aguja muy fina. Casi siempre se requieren varias aplicaciones.','Frenar el crecimiento de vasos anormales, el edema o la inflamación de la retina para conservar o mejorar la visión.','Láser, cirugía de vítreo, otro medicamento u observación, según el diagnóstico.',['Ojo rojo en el sitio de la inyección (hemorragia en la conjuntiva)','Sensación de cuerpo extraño y moscas volantes temporales','Aumento temporal de la presión del ojo'],['Infección grave dentro del ojo (endoftalmitis): avisar de inmediato si hay dolor, más rojez o baja de visión','Desprendimiento de retina','Daño al cristalino (catarata)','Sangrado dentro del ojo','Eventos generales poco frecuentes asociados al medicamento'],'La enfermedad de la retina puede avanzar y causar pérdida de visión.'],
 [/pterig|amniot|recubrimiento/i,null,'pterigion','Cirugía de pterigión: se retira la carnosidad que crece sobre la córnea y se cubre la zona con un injerto de conjuntiva del mismo ojo o con membrana amniótica, fijado con puntos o pegamento biológico.','Retirar la lesión, mejorar la superficie del ojo y disminuir la irritación y el astigmatismo que causa.','Lubricantes y protección contra el sol mientras la lesión no afecte la visión, u observación.',['Ojo rojo, ardor, lagrimeo y sensación de cuerpo extraño varios días','Puntos que molestan hasta retirarse o reabsorberse','Cicatriz visible'],['Reaparición del pterigión (recidiva)','Infección','Desprendimiento o falla del injerto','Adelgazamiento de la esclera o la córnea','Visión doble poco frecuente'],'El pterigión puede seguir creciendo hacia el centro de la córnea, aumentar el astigmatismo y afectar la visión.'],
 [/estrabismo/i,null,'estrabismo','Cirugía de estrabismo: se cambia la posición de uno o más músculos que mueven el ojo para alinear la mirada.','Mejorar la alineación de los ojos y, según el caso, la visión de ambos ojos juntos o la apariencia.','Lentes, prismas, ejercicios, parches o toxina botulínica, según el caso.',['Ojo rojo y molestia al mover el ojo','Sensación de cuerpo extraño por los puntos','Visión doble temporal','Corrección incompleta o excesiva que requiere ajustes o lentes'],['Necesidad de otra cirugía','Visión doble persistente','Perforación de la pared del ojo','Infección','Pérdida del músculo','Pérdida de visión excepcional'],'El ojo puede seguir desviado; en niños puede afectar el desarrollo de la visión (ojo flojo).'],
 [/blefaro|ptosis|entrop|ectrop|parpad|párpad/i,null,'parpados','Cirugía de párpados: se retira o reacomoda piel, músculo o grasa (blefaroplastia), se ajusta el músculo que levanta el párpado (ptosis) o se corrige la posición del borde del párpado (entropión o ectropión).','Mejorar la función del párpado, el campo visual superior, la protección del ojo y la apariencia.','Observación, lubricantes o, según el caso, otros tratamientos.',['Hinchazón y moretones una a dos semanas','Ojo seco o lagrimeo temporal','Dificultad temporal para cerrar por completo el ojo','Cicatriz visible'],['Diferencia entre ambos lados (asimetría)','Corrección insuficiente o excesiva que requiere otra cirugía','Infección o abertura de la herida','Sangrado detrás del ojo (raro, urgente)','Pérdida de visión excepcional'],'El problema del párpado puede persistir o avanzar con molestias, irritación o limitación de la visión.'],
 [/chalaz|lesi[oó]n|biopsia|tumor/i,null,'lesion','Retiro de chalazión o lesión del párpado o del ojo: con anestesia local se drena o se extirpa la lesión; si es necesario se envía a estudio de patología (biopsia).','Retirar la lesión y, en su caso, conocer su diagnóstico.','Compresas tibias, medicamentos, inyección de esteroide u observación, según la lesión.',['Hinchazón, moretón y molestia unos días','Pequeña cicatriz'],['Reaparición de la lesión','Infección','Cambio en la forma del borde del párpado','Necesidad de otro tratamiento según el resultado de patología'],'La lesión puede persistir, crecer o infectarse; si no se estudia, no se conoce su naturaleza.'],
 [/dacrio|dcr|lagrimal|sondeo/i,null,'lagrimal','Cirugía de vías lagrimales: sondeo (paso de una sonda fina por el conducto) o dacriocistorrinostomía (se crea una nueva comunicación entre el saco lagrimal y la nariz); puede dejarse una sonda de silicón por algunas semanas.','Que la lágrima drene a la nariz y disminuyan el lagrimeo, las secreciones y las infecciones del saco lagrimal.','Masaje, antibióticos u observación, según el caso.',['Sangrado leve por la nariz','Hinchazón y moretón','Molestia por la sonda'],['Cierre de nuevo del conducto (falla)','Infección','Cicatriz visible si es por fuera','Salida o desplazamiento de la sonda','Necesidad de otra cirugía'],'Persisten el lagrimeo y el riesgo de infecciones del saco lagrimal.'],
 [/quer?atoplast|trasplante de c[oó]rnea|corneal \/ lavado|reparaci|herida|lavado/i,null,'cornea','Cirugía de córnea: se sustituye la córnea enferma por tejido donado (queratoplastia) o se repara una herida del ojo y se lavan sangre, restos o material de la cámara anterior.','Recuperar la transparencia o la integridad del ojo para conservar o mejorar la visión.','Lentes de contacto especiales, medicamentos u observación, según el caso.',['Visión borrosa por semanas o meses','Astigmatismo alto que requiere lentes o ajuste de puntos','Inflamación y aumento de la presión del ojo','Uso prolongado de gotas'],['Rechazo del injerto, que puede ocurrir incluso años después','Infección','Falla del injerto con necesidad de otro trasplante','Glaucoma o catarata','Pérdida del ojo o de la visión'],'La córnea puede seguir opaca o la herida complicarse, con pérdida de visión o del ojo.'],
 [/crosslink|anillo/i,null,'cxl','Tratamiento de córnea por queratocono: crosslinking (se retira el epitelio, se aplica riboflavina y luz ultravioleta para endurecer la córnea) y/o implante de anillos intraestromales (segmentos que aplanan la córnea).','Frenar el avance del queratocono y, en el caso de los anillos, mejorar la forma de la córnea y la visión con lentes.','Lentes de contacto especiales, lentes, observación o, en casos avanzados, trasplante de córnea.',['Dolor, lagrimeo y molestia a la luz los primeros días','Visión borrosa semanas','Neblina (haze) temporal en la córnea'],['Infección de la córnea','Cicatriz que afecte la visión','Que el queratocono siga avanzando','Extrusión o desplazamiento del anillo que requiera retirarlo'],'El queratocono puede seguir avanzando y hacer necesario un trasplante de córnea.'],
 [/lasik|prk|refractiv/i,null,'refractiva','Cirugía refractiva con láser (LASIK o PRK): se moldea la córnea con láser excimer para corregir miopía, hipermetropía o astigmatismo.','Disminuir o eliminar la dependencia de lentes. No evita la presbicia (vista cansada) ni otras enfermedades del ojo.','Lentes de armazón, lentes de contacto o lente fáquico ICL.',['Ojo seco por meses','Halos, deslumbramiento y molestias con la luz de noche','Corrección incompleta o excesiva que puede requerir retoque o lentes','Dolor los primeros días en PRK'],['Infección de la córnea','Complicaciones del colgajo (LASIK)','Ectasia: debilitamiento de la córnea','Neblina (haze) en PRK','Pérdida de visión mejor corregida'],'Se sigue usando lentes; no hay daño por no operarse.'],
 [/icl|f[aá]quico/i,null,'icl','Implante de lente fáquico (ICL): se coloca un lente dentro del ojo, por delante del cristalino natural, para corregir graduaciones altas.','Disminuir o eliminar la dependencia de lentes cuando el láser no es recomendable.','Lentes de armazón, lentes de contacto o cirugía con láser si es candidato.',['Halos y deslumbramiento','Aumento temporal de la presión del ojo','Graduación residual'],['Catarata','Glaucoma por cierre del ángulo','Pérdida de células de la córnea','Infección grave (endoftalmitis)','Necesidad de recambiar o retirar el lente'],'Se sigue usando lentes; no hay daño por no operarse.'],
 [/eviscera|enuclea/i,null,'evisc','Evisceración o enucleación: se retira el contenido o la totalidad del ojo, que no tiene visión útil o causa dolor o riesgo, y se coloca un implante para conservar volumen; después se adapta una prótesis.','Quitar el dolor, controlar una infección o un tumor y permitir el uso de una prótesis estética.','Tratamiento del dolor con medicamentos o inyecciones, u observación.',['Dolor e hinchazón los primeros días','Secreción'],['Infección','Exposición o salida del implante','Hundimiento del párpado o de la órbita','Necesidad de otra cirugía para la prótesis','Inflamación del otro ojo (oftalmía simpática), muy rara'],'Puede persistir el dolor, la infección o el riesgo según la causa.']

const OCR_V={t:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',w:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',c:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',l:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa@1.0.0/4.0.0_best_int',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};
const _scr={};
function cargarScript(u){return _scr[u]||(_scr[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{delete _scr[u];rej(new Error('No se pudo cargar el lector'))};document.head.appendChild(s)}))}
let _ocrW=null;
async function ocrWorker(){if(!_ocrW){await cargarScript(OCR_V.t);_ocrW=Tesseract.createWorker('spa',1,{workerPath:OCR_V.w,corePath:OCR_V.c,langPath:OCR_V.l})}return _ocrW}
async function imagenComprobante(file){
  if(!/pdf/i.test(file.type||'')&&!/\.pdf$/i.test(file.name||''))return file;
  await cargarScript(OCR_V.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=OCR_V.pdfw;
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pg=await doc.getPage(1),vp=pg.getViewport({scale:2.2});
  const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;return cv;
}

function ligarComprobante(box,fileSel,montoSel,folioSel,pac){

async function confirmarLectura(l,monto){

  if(l.error||!l.montos||!l.montos.length){const mot=await pedirTexto('No se pudo leer el monto','¿Por qué se guarda sin verificar? (foto borrosa, comprobante manual…)');if(!mot)return null;return {...l,coincide:false,motivo:mot}}
