function invAlertas(){
  const hoy=hoyISO(),qxU=new Set(ubicSede().map(u=>u.id)),sedeU=ubicIdsSede();
  const prox=S.cx.filter(c=>sedeU.has(c.sala_id)&&c.estado!=='cancelada'&&!c.consumo_cerrado&&c.fecha>=hoy&&c.fecha<=addDays(hoy,14)).sort((a,b)=>(a.fecha+a.hora)<(b.fecha+b.hora)?-1:1);
  const ms=matsQX().map(m=>{const s=semaforo(m),d14=demandaMat(m.id,14),min=num(m.stock_minimo);
    // cirugías que se quedarían sin material (consumo acumulado en orden de fecha)
    let resto=s.st;const afect=[];
    for(const c of prox){const it=S.cxItems.find(i=>i.cirugia_id===c.id&&i.material_id===m.id&&i.cantidad_usada==null);if(!it)continue;resto-=num(it.cantidad_plan);if(resto<0)afect.push(c)}
    const cob=d14>0?Math.floor(s.st/(d14/14)):null;
    const sug=Math.max(0,Math.ceil((num(m.stock_maximo)||min*2)+d14-s.st));
    return {m,...s,min,d14,afect,cob,sug,agot:s.st<=0&&min>0,crit:critOf(m)==='critico'}});
  const ord=(a,b)=>(b.crit-a.crit)||(b.afect.length-a.afect.length)||(a.st-a.min)-(b.st-b.min);
  const agot=ms.filter(x=>x.agot).sort(ord);
  const sinCx=ms.filter(x=>!x.agot&&x.afect.length).sort(ord);
  const bajo=ms.filter(x=>!x.agot&&!x.afect.length&&x.nivel!=='ok').sort(ord);
  const lotes=S.lotes.filter(l=>qxU.has(l.ubicacion_id)&&num(l.cantidad)>0&&l.caducidad).map(l=>({l,m:matById(l.material_id),d:diasHasta(l.caducidad)})).filter(x=>x.m&&!esCarro(x.m)).sort((a,b)=>a.d-b.d);
  const venc=lotes.filter(x=>x.d<0),cad30=lotes.filter(x=>x.d>=0&&x.d<=30),cad90=lotes.filter(x=>x.d>30&&x.d<=90);
  const urg=agot.filter(x=>x.crit).length+sinCx.length+venc.length;
  return {ms,agot,sinCx,bajo,venc,cad30,cad90,urg,total:agot.length+sinCx.length+bajo.length+venc.length+cad30.length}
}

function formPedido(mids,extras){
  const filas=(extras||[]).map(e=>({material_id:null,nombre:e.nombre,unidad:e.unidad||'pza',cantidad:e.cantidad,especial:true,critico:true})).concat(mids.map(id=>{const m=matById(id),s=semaforo(m);const sug=Math.max(1,Math.ceil((num(m.stock_maximo)||num(m.stock_minimo)*2)-s.proy));return {material_id:id,nombre:m.nombre,unidad:m.unidad,cantidad:sug,proveedor_id:m.proveedor_id,costo:num(m.costo),critico:m.critico,nivel:s.nivel}}));
  const m=modal(`<div id="fp"></div>`);
  const draw=()=>{m.querySelector('#fp').innerHTML=`${mhead('Pedido a COE Finanzas')}<div class="muted">Se envía como solicitud del área Quirófano; Administración la autoriza en COE Finanzas.</div>
  <table style="margin-top:8px"><tr><th>Partida</th><th>Cant.</th><th></th></tr>${filas.map((f,i)=>`<tr><td>${h(f.nombre)} <span class="muted">${h(f.unidad||'')}</span>${f.critico?' <span class="pill p-rojo">crítico</span>':''}</td><td><input class="qty" type="number" step="any" value="${f.cantidad}" onchange="this.closest('.modal')._f[${i}].cantidad=num(this.value)"></td><td><button class="btn sec sm" data-del="${i}">✕</button></td></tr>`).join('')||'<tr><td colspan=3 class="muted">Agrega partidas</td></tr>'}</table>
  <div class="row" style="margin-top:8px">${selMat('pM')}<button class="btn sec" style="flex:0 0 auto" id="pAdd">Agregar</button></div>
  <div class="row"><input id="pLibre" placeholder="Material especial no catalogado (descripción)"><input id="pLibreC" type="number" placeholder="Cant." style="flex:0 0 90px"><button class="btn sec" style="flex:0 0 auto" id="pAddL">Agregar</button></div>
  <label>Requerido para</label><input id="pF" type="date" value="${addDays(hoyISO(),7)}">
  <div class="sw"><input type="checkbox" id="pU" ${filas.some(f=>f.critico||f.nivel==='critico')?'checked':''}><label for="pU" style="margin:0;text-transform:none;font-size:15px;color:var(--ink)">Urgente</label></div>
  <label>Notas</label><textarea id="pN"></textarea>
  <div class="acts"><button class="btn" id="pOk">Enviar con PIN</button></div>`;
  m._f=filas;
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{filas.splice(b.dataset.del,1);draw()});
  m.querySelector('#pAdd').onclick=()=>{const id=m.querySelector('#pM').value;if(!id||filas.some(f=>f.material_id===id))return;const mt=matById(id);filas.push({material_id:id,nombre:mt.nombre,unidad:mt.unidad,cantidad:1,proveedor_id:mt.proveedor_id,costo:num(mt.costo),critico:mt.critico});draw()};
  m.querySelector('#pAddL').onclick=()=>{const d=m.querySelector('#pLibre').value.trim();if(!d)return;filas.push({material_id:null,nombre:d,unidad:'pza',cantidad:num(m.querySelector('#pLibreC').value)||1,especial:true});draw()};
  m.querySelector('#pOk').onclick=async()=>{
    if(!filas.length)return toast('Agrega al menos una partida',true);
    if(!await pedirPIN('Enviar pedido a COE Finanzas'))return;
    const provs=[...new Set(filas.map(f=>f.proveedor_id).filter(Boolean))];
    const monto=filas.reduce((a,f)=>a+num(f.costo)*num(f.cantidad),0);
    try{await q(sb.from('fin_pedidos').insert({folio:folio('QX'),area:'Quirófano',sede:sedeById(S.sede)?.nombre,entidad_id:provs.length===1?provs[0]:null,
      descripcion:'Pedido de quirófano: '+filas.map(f=>f.nombre).slice(0,4).join(', ')+(filas.length>4?' y '+(filas.length-4)+' más':''),
      partidas:filas.map(f=>({material_id:f.material_id,descripcion:f.nombre,cantidad:f.cantidad,unidad:f.unidad,costo_unitario:f.costo||null,critico:!!f.critico,especial:!!f.especial})),
      monto_estimado:monto||null,urgente:m.querySelector('#pU').checked,fecha_requerida:m.querySelector('#pF').value||null,estado:'solicitado',solicitado_at:new Date().toISOString(),
      notas:['Solicitado por '+S.user.nombre+' desde COE Quirófano',m.querySelector('#pN').value].filter(Boolean).join('\n')}),'Enviar pedido');
      await logA('pedido_finanzas','fin_pedidos',null,{partidas:filas.length});m.remove();toast('Pedido enviado a COE Finanzas');await loadAll();render()}catch(e){}
  };};draw();
}

async function comprimir(file){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const max=1400,r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.8)};img.onerror=rej;img.src=URL.createObjectURL(file)})
}

  m.querySelector('#fF').onchange=e=>{const f=e.target.files[0];if(f){const p=m.querySelector('#fPrev');p.src=URL.createObjectURL(f);p.classList.remove('hidden')}};

      const up=await sb.storage.from('qx-fotos').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;

      await q(sb.from('qx_lecturas_tanque').insert({tanque_id:tid,presion:num(p),foto_url:url,usuario_id:S.user.id,usuario_nombre:S.user.nombre,nota:m.querySelector('#fN').value||null}));

/* ============================================================
   MENSAJES AL PACIENTE Y SEGUIMIENTO POSOPERATORIO
   ============================================================ */
const OJO_TXT={OD:'derecho',OI:'izquierdo',AO:'ambos ojos',Derecho:'derecho',Izquierdo:'izquierdo',Bilateral:'ambos ojos'};
const ojoTxt=o=>OJO_TXT[o]||o||'';
const MSJ_NOM={recordatorio_48h:'Recordatorio de cirugía (48 h)',seguimiento_d3:'Seguimiento posoperatorio día 3',cita_subsecuente:'Recordatorio de cita subsecuente',control_largo:'Control a largo plazo'};
const addMonths=(iso,n)=>{const d=new Date(String(iso).slice(0,10)+'T12:00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const localISO=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const PLANT={
 recordatorio_48h:'Hola {nombre}, le saludamos del Centro Ocular Especializado. Le recordamos su cirugía de {procedimiento} del ojo {ojo} el {fecha} a las {hora}. Venga en ayunas de 6 horas, con un acompañante, sin maquillaje y traiga sus medicamentos. Por favor confirme respondiendo este mensaje. Tel. {tel}',
 seguimiento_d3:'Hola {nombre}, le saludamos del Centro Ocular Especializado. ¿Cómo sigue de su ojo {ojo}? Por favor conteste 3 preguntas rápidas aquí: {link}\n\nSi tiene ojo rojo, lagañas o pérdida de visión, comuníquese de inmediato al {tel} o por este WhatsApp.',
 cita_subsecuente:'Hola {nombre}, le recordamos su cita de revisión en el Centro Ocular Especializado el {fecha_cita} a las {hora_cita}. Traiga sus gotas y sus lentes. Si no puede asistir, avísenos por este medio. Tel. {tel}',
 control_largo:'Hola {nombre}, han pasado {meses} meses desde su cirugía del ojo {ojo}. Es importante su revisión de control para detectar a tiempo opacidad de cápsula posterior y otras complicaciones{riesgo}. Responda este mensaje para agendar su cita. Centro Ocular Especializado, tel. {tel}'
};
const waNum=t=>{const d=String(t||'').replace(/\D/g,'');return d.length===10?'52'+d:d.length===12&&d.startsWith('52')?d:d.length===13&&d.startsWith('521')?'52'+d.slice(3):d};
function textoMsj(m){
  const c=S.cx.find(x=>x.id===m.cirugia_id)||{};
  const ci=c.cita_subsecuente?new Date(c.cita_subsecuente):null;
  const meses=Math.max(1,Math.round((new Date(m.programado_para+'T12:00:00')-new Date(String(m.fecha_cirugia||c.fecha)+'T12:00:00'))/2.63e9));
  const v={nombre:m.paciente_nombre||c.paciente_nombre||'',procedimiento:m.procedimiento||c.procedimiento||'',ojo:ojoTxt(m.ojo||c.ojo),
    fecha:fFecha(c.fecha||m.fecha_cirugia),hora:hhmm(c.hora),tel:cfg('tel_clinica','(459) 100 0431'),link:location.origin+location.pathname+'?seg='+m.token,
    fecha_cita:ci?fFecha(localISO(ci)):'',hora_cita:ci?pad(ci.getHours())+':'+pad(ci.getMinutes()):'',meses,riesgo:m.prioridad?', y en su caso es especialmente importante':''};
  return cfg('msg_'+m.tipo,PLANT[m.tipo]).replace(/\{(\w+)\}/g,(_,k)=>v[k]??'')
}
async function syncMensajes(){
  if(!can.programar()||!S.cx.length)return;
  const ex=await sb.from('qx_mensajes').select('id,cirugia_id,tipo,programado_para,estado,prioridad').in('cirugia_id',S.cx.map(c=>c.id)).then(r=>r.data||[]);
  const find=(c,t)=>ex.find(x=>x.cirugia_id===c&&x.tipo===t);
  const ins=[],upd=[];
  const base=c=>({paciente_nombre:c.paciente_nombre,telefono:c.telefono,ojo:c.ojo,procedimiento:c.procedimiento,fecha_cirugia:c.fecha,sede_id:c.sede_id});
  const want=(c,tipo,fecha,prio,reenviar)=>{const e=find(c.id,tipo);
    if(!e)ins.push({cirugia_id:c.id,...base(c),tipo,programado_para:fecha,prioridad:!!prio});
    else if(e.programado_para!==fecha&&(e.estado==='pendiente'||(reenviar&&e.estado!=='cancelado')))upd.push([e.id,{programado_para:fecha,prioridad:!!prio,estado:'pendiente',enviado_at:null,...base(c)}]);
    else if(e.estado==='pendiente'&&!!e.prioridad!==!!prio)upd.push([e.id,{prioridad:!!prio}])};
  const cancel=(c,tipo)=>{const e=find(c.id,tipo);if(e&&e.estado==='pendiente')upd.push([e.id,{estado:'cancelado'}])};
  for(const c of S.cx){
    if(c.estado==='cancelada'){Object.keys(MSJ_NOM).forEach(t=>cancel(c,t));continue}
    if(c.consumo_cerrado||c.estado==='realizada'){
      cancel(c,'recordatorio_48h');
      want(c,'seguimiento_d3',addDays(c.fecha,3));
      if(c.lio_requerido||c.lio_implantado_id){const r=c.riesgo_diabetes||c.riesgo_glaucoma;want(c,'control_largo',addMonths(c.fecha,num(cfg(r?'meses_control_riesgo':'meses_control',r?4:6))),r)}
    }else if(c.fecha>=hoyISO())want(c,'recordatorio_48h',addDays(c.fecha,-2),false,true);
    if(c.cita_subsecuente)want(c,'cita_subsecuente',addDays(localISO(c.cita_subsecuente),-1),false,true);
  }
  if(ins.length)await sb.from('qx_mensajes').upsert(ins,{onConflict:'cirugia_id,tipo',ignoreDuplicates:true});
  for(const [id,ch] of upd)await sb.from('qx_mensajes').update(ch).eq('id',id);
}
async function cargarMensajes(){
  const lim=addDays(hoyISO(),7),hace=new Date(Date.now()-10*864e5).toISOString();
  const r=await sb.from('qx_mensajes').select('*').or(`and(estado.eq.pendiente,programado_para.lte.${lim}),and(alarma.eq.true,atendido_at.is.null),and(estado.eq.enviado,enviado_at.gte.${hace}),and(estado.eq.respondido,created_at.gte.${hace})`).order('programado_para').limit(500);
  S.msj=(r.data||[]).filter(m=>m.estado!=='cancelado'&&!(m.estado==='pendiente'&&m.programado_para>lim)&&!(m.tipo==='recordatorio_48h'&&m.estado==='pendiente'&&m.fecha_cirugia<hoyISO()));
  const al=S.msj.filter(m=>m.alarma&&!m.atendido_at).map(m=>m.id);
  if(S._alarmas){const nuevas=al.filter(i=>!S._alarmas.includes(i));if(nuevas.length)avisoAlarma(nuevas.map(i=>S.msj.find(m=>m.id===i)))}
  S._alarmas=al;
}
function avisoAlarma(ms){
  const t='⚠️ Datos de alarma: '+ms.map(m=>m.paciente_nombre).join(', ');
  toast(t,true);
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('COE Quirófano — alerta posoperatoria',{body:t})}catch(e){}
  try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.15;o.start(a.currentTime+d);o.stop(a.currentTime+d+.2)})}catch(e){}
}
const alarmasPend=()=>S.msj.filter(m=>m.alarma&&!m.atendido_at&&(!m.sede_id||m.sede_id===S.sede));
const msjPorEnviar=()=>S.msj.filter(m=>m.estado==='pendiente'&&m.programado_para<=hoyISO()&&(!m.sede_id||m.sede_id===S.sede));
const sintomas=r=>r?[r.ojo_rojo&&'ojo rojo',r.lagana&&'lagañas',r.vision&&'pérdida de visión'].filter(Boolean):[];

  <div class="muted">${MSJ_NOM[m.tipo]} · ${m.estado==='pendiente'?(m.programado_para<hoyISO()?'<b style="color:var(--rojo)">atrasado desde '+fCorta(m.programado_para)+'</b>':'para '+fCorta(m.programado_para)):m.estado+' '+fDT(m.enviado_at||m.created_at)+(m.enviado_por?' por '+h(m.enviado_por):'')} · cirugía ${fCorta(m.fecha_cirugia)} · ${h(m.telefono||'sin teléfono')}</div>
  ${r?`<div style="margin-top:4px">${sx.length?`<span class="pill p-rojo">⚠ ${sx.join(' · ')}</span>`:'<span class="pill p-verde">Sin datos de alarma</span>'} <span class="muted">${r.via==='manual'?'capturado por '+h(r.por||''):'respondió el paciente'} ${fDT(r.at)}</span>${r.comentario?`<div class="muted">"${h(r.comentario)}"</div>`:''}</div>`:''}
  ${m.atendido_at?`<div class="muted">✓ Atendido por ${h(m.atendido_por)} · ${fDT(m.atendido_at)} · ${h(m.atendido_nota||'')}</div>`:''}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50%">${btns}</div></div>`

function vMensajes(){
  const hoy=hoyISO(),sede=m=>!m.sede_id||m.sede_id===S.sede;const L=S.msj.filter(sede);
  const alarm=alarmasPend(),due=msjPorEnviar().sort((a,b)=>(b.prioridad-a.prioridad)||(a.programado_para<b.programado_para?-1:1));
  const sinResp=L.filter(m=>m.tipo==='seguimiento_d3'&&m.estado==='enviado'&&Date.now()-new Date(m.enviado_at)>20*3600e3);

  <div class="muted" style="margin-bottom:10px">Los mensajes se abren en WhatsApp ya redactados; solo hay que enviarlos. Cuando el bot de WhatsApp esté listo, saldrán solos.</div>`;

  html+=`<div class="card"><h3>Por enviar hoy ${due.length?`<span class="pill p-amar">${due.length}</span>`:''}</h3>${due.map(m=>msjRow(m,pp?`<button class="btn sm" onclick="enviarMsj('${m.id}')">Enviar WhatsApp</button>${m.tipo==='seguimiento_d3'?`<button class="btn sm sec" onclick="respManual('${m.id}')">Capturar respuesta</button>`:''}`:'')).join('')||'<div class="muted">Nada pendiente</div>'}</div>`;
  if(sinResp.length)html+=`<div class="card"><h3>Seguimiento día 3 sin respuesta</h3><div class="muted">Más de 20 h sin contestar: llamar o reenviar.</div>${sinResp.map(m=>msjRow(m,pp?`<a class="btn sm" href="tel:${h(String(m.telefono||'').replace(/\D/g,''))}">📞 Llamar</a><button class="btn sm sec" onclick="enviarMsj('${m.id}')">Reenviar</button><button class="btn sm sec" onclick="respManual('${m.id}')">Capturar respuesta</button>`:'')).join('')}</div>`;

  $('#main').innerHTML=html;

async function enviarMsj(id){

const vigDias=cat=>num(cfg('vig_'+cat,cat==='estudio'?15:30));
const precioVig=p=>!p.vigente_hasta||p.vigente_hasta>=hoyISO();
const precioOk=p=>p&&p.activo&&num(p.precio)>0&&precioVig(p);
const pById=id=>S.precios.find(p=>p.id===id);
const ojosTxt=it=>!it.ojos||!it.ojos.length?'—':it.ojos.length===2?(it.lateralidad==='ambos_ojos'?'Ambos ojos':'Ambos ojos · inicia '+(it.ojo_inicio||'OD')):(it.ojos[0]==='OD'?'OD (derecho)':'OI (izquierdo)');
const estadoCot=c=>c.estado==='vigente'&&c.vigencia_hasta<hoyISO()?'vencida':c.estado;

const sedeDir=()=>{const s=sedeById(S.sede)?.nombre||'';return cfg('dir_'+s,s.startsWith('Mor')?'Hospital Victoria, Consultorio 1206, Piso 12, Av. Acueducto 2800, Morelia, Mich.':'Av. Luis Donaldo Colosio 151, Col. La Purísima, Tacámbaro, Mich.')};
const telsClinica=()=>cfg('tels_cotizacion','Tel. (443) 465 6645 y (459) 596 2268 · WhatsApp (459) 134 55 29');
const randTok=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')};

function calcItem(it){
  const n=(it.ojos||[]).length||1;let base,et;
  if(it.lateralidad==='por_ojo'){
    if(n===2&&num(it.precio_bilateral)>0){base=num(it.precio_bilateral);et=`Precio especial por los dos ojos (${money(num(it.precio_bilateral)/2)} c/u)`}
    else{base=num(it.precio)*n;et=n===2?`${money(it.precio)} por ojo × 2 ojos`:`${money(it.precio)} por ojo · solo ${it.ojos[0]}`}
  }else if(it.lateralidad==='ambos_ojos'){base=num(it.precio);et='Precio por ambos ojos (incluye los dos)'}
  else{const c=num(it.cantidad)||1;base=num(it.precio)*c;et=c>1?`${money(it.precio)} × ${c}`:'Precio por procedimiento'}
  const lioSum=(it.ojos||[]).reduce((a,o)=>a+num(it.lio?.[o]?.precio),0);
  const subtotal=base+lioSum;
  return {base,lioSum,subtotal,et,descMax:it.permite_descuento?subtotal*num(it.desc_max_pct)/100:0,descontable:subtotal}
}
function calcCot(Q){
  const cs=Q.items.map(calcItem);
  const subtotal=cs.reduce((a,c)=>a+c.subtotal,0),descontable=cs.reduce((a,c)=>a+c.descontable,0),descMax=cs.reduce((a,c)=>a+c.descMax,0);
  let descuento=Q.desc_tipo==='pct'?descontable*num(Q.desc_val)/100:Math.min(num(Q.desc_val),descontable);
  descuento=Math.round(descuento*100)/100;
  const total=subtotal-descuento,factor=subtotal?total/subtotal:1;
  const cirTotal=Q.items.reduce((a,it,i)=>a+(it.categoria==='cirugia'?cs[i].subtotal-(cs[i].descontable&&descontable?descuento*cs[i].descontable/descontable:0):0),0);
  const anticipo=cirTotal>0?anticipoMin(cirTotal):0;
  const cats=[...new Set(Q.items.map(i=>i.categoria))];
  const dias=cats.length?Math.min(...cats.map(vigDias)):30;
  return {cs,subtotal,descontable,descMax,descuento,total,anticipo,cirTotal,requiereAut:descuento>descMax+0.5,vigencia:addDays(hoyISO(),dias),dias}
}

  const corto=n=>n==='Otorrinolaringología'?'Otorrino':n==='Oftalmología'?'Oftalmología':n;
  return [...esps.map(e=>['cir:'+e.id,'Cirugía','  '+corto(e.nombre)]),['laser','Láser','Oftalmología'],['estudio','Estudios','y paquetes']].map(([k,t,s])=>[k,t,s.trim()])

function pickerCat(cat){

  if(!ps.length)return '<div class="muted">No hay conceptos en esta categoría. Dirección los agrega en Más → Precios y vigencias.</div>';

  if(grupos['Paquetes de estudios']){const g={'Paquetes de estudios':grupos['Paquetes de estudios']};Object.keys(grupos).forEach(k=>{if(!g[k])g[k]=grupos[k]});Object.keys(grupos).forEach(k=>delete grupos[k]);Object.assign(grupos,g)}
  const muchos=(cat==='cirugia'||cat==='laser')&&ps.length>10&&ps.some(p=>p.comun);

async function qrURL(text){

const fmtTel=t=>{const d=String(t||'').replace(/\D/g,'');return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)} ${d.slice(6,8)} ${d.slice(8)}`:t||''};

function costosOjo(c,it){
  const k=calcItem(it),n=(it.ojos||[]).length||1;
  const descontable=(c.items||[]).reduce((a,x)=>a+calcItem(x).descontable,0);
  const f=num(c.descuento)&&descontable?1-num(c.descuento)/descontable:1;
  const r=x=>f===1?Math.round(x):Math.round(x*f/10)*10;
  const lioN=o=>it.lio?.[o]?('Incluye lente '+String(it.lio[o].nombre).replace(/^LIO /i,'')+(it.lio[o].poder?' '+it.lio[o].poder+' D':'')):'';
  if(it.lateralidad==='por_ojo'){
    const orden=it.ojos.length===2&&it.ojo_inicio?[it.ojo_inicio,...it.ojos.filter(o=>o!==it.ojo_inicio)]:it.ojos;
    return orden.map((o,i)=>({etq:(o==='OD'?'OJO DERECHO':'OJO IZQUIERDO'),primero:it.ojos.length===2&&i===0&&it.categoria==='cirugia',nota:lioN(o),monto:r(k.base/n+num(it.lio?.[o]?.precio))}))
  }

  return [{etq:'COSTO',nota:'',monto:r(k.subtotal)}];
}

function tipoItem(nombre){const n=normTxt(nombre).trim();

  if(/(fac+o|catarat|extracapsular|lente intraocular|recambio de lente|reacomodo|\blio\b)/.test(n))return 'catarata';

  if(/(trabe|glauc|valvul|ahmed|dicision|needling)/.test(n))return 'glaucoma';
  if(/pteri/.test(n))return 'pterigion';
  if(/(lasik|femto|fento|prk|icl)/.test(n))return 'refractiva';
  if(/(cross|querat|cornea|hidrops)/.test(n))return 'cornea';
  if(/(blefar|chala|ptosis|parpad|palpebr|lagrim|dacri|\bdcr\b|evisc|enucl|entrop|ectrop|tarsal|torsal|quiste|lipoma|granulom|conjunt|lesion|neurolis|moll)/.test(n))return 'parpados';

function ajusteMasivo(){
  const m=modal(`${mhead('Ajuste masivo de precios y vigencias')}<div class="muted">Útil para el cambio de año o de lista de precios.</div>
  <label for="amC">Categoría</label><select id="amC"><option value="">Todas</option>${Object.entries(CATS).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select>
  <label for="amP">Ajuste de precio (%)</label><input id="amP" type="number" placeholder="Ej. 5 sube 5%, -3 baja 3%, vacío no cambia">
  <label for="amR">Redondear a</label><select id="amR"><option value="1">$1</option><option value="10">$10</option><option value="50">$50</option><option value="100" selected>$100</option></select>
  <label for="amV">Nueva vigencia hasta</label><input id="amV" type="date">
  <div id="amI" class="muted" style="margin-top:8px"></div><div class="acts"><button class="btn" id="ok">Aplicar con PIN</button></div>`,'sm');
  const sel=()=>S.precios.filter(p=>p.activo&&num(p.precio)>0&&(!m.querySelector('#amC').value||p.categoria===m.querySelector('#amC').value));
  const info=()=>{const l=sel(),pc=num(m.querySelector('#amP').value),rd=num(m.querySelector('#amR').value);m.querySelector('#amI').innerHTML=`${l.length} conceptos con precio${pc&&l[0]?` · ej. ${h(l[0].nombre)}: ${money(l[0].precio)} → ${money(Math.round(num(l[0].precio)*(1+pc/100)/rd)*rd)}`:''}`};
  m.querySelectorAll('input,select').forEach(x=>x.oninput=info);info();
  m.querySelector('#ok').onclick=async()=>{const l=sel(),pc=num(m.querySelector('#amP').value),rd=num(m.querySelector('#amR').value),v=m.querySelector('#amV').value;
    if(!pc&&!v)return toast('Indica un % o una nueva vigencia',true);
    if(!await pedirPIN('Ajuste masivo de '+l.length+' precios'))return;
    for(const p of l){const ch={updated_at:new Date().toISOString()};if(pc){ch.precio=Math.round(num(p.precio)*(1+pc/100)/rd)*rd;if(num(p.precio_bilateral))ch.precio_bilateral=Math.round(num(p.precio_bilateral)*(1+pc/100)/rd)*rd}if(v){ch.vigente_hasta=v;ch.vigente_desde=hoyISO()}await q(sb.from('qx_precios').update(ch).eq('id',p.id))}
    await logA('ajuste_masivo_precios','qx_precios',null,{n:l.length,pct:pc,vigencia:v});m.remove();toast('Precios actualizados');await loadAll();render()};
}

function vClasif(out){out('<div class="card" id="clBox"></div>');setTimeout(()=>{if($('#clBox'))clasifUI($('#clBox'))},0)}
function clasifUI(root,done){
  const ms=S.mat.filter(m=>m.activo).sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||a.nombre.localeCompare(b.nombre));
  const cam={};let fq='',fk='todos';
  root.innerHTML=`${done?mhead('Criticidad y mínimos de material'):'<h3>Criticidad y mínimos de material</h3>'}<div class="muted">Marca la criticidad de cada material y ajusta su mínimo y nivel crítico. Solo se guardan los que cambies (con tu PIN).</div>
   <div class="muted" style="margin:6px 0">${CRIT_ORD.map(k=>`<b>${CRIT[k][0]}:</b> ${CRIT[k][2]}.`).join(' ')} <b>Mínimo:</b> al llegar ahí se pinta amarillo y se sugiere pedir. <b>Nivel crítico:</b> rojo, urgente.</div>
   <div class="row" style="margin:8px 0"><input id="clQ" placeholder="Buscar material o categoría"><select id="clK" aria-label="Filtrar"><option value="todos">Todos (${ms.length})</option>${CRIT_ORD.map(k=>`<option value="${k}">${CRIT[k][0]}</option>`).join('')}<option value="sinmin">Sin mínimo capturado</option><option value="bajo">Bajo mínimo hoy</option><option value="re">Reesterilizables</option></select></div>
   <div id="clL" style="max-height:${done?'55vh':'65vh'};overflow:auto"></div>
   <div class="acts"><span class="muted" id="clN" style="align-self:center;margin-right:auto">Sin cambios</span><button class="btn" id="clOk">Guardar cambios con PIN</button></div>`;
  const val=(mm,k)=>cam[mm.id]&&k in cam[mm.id]?cam[mm.id][k]:k==='criticidad'?critOf(mm):mm[k];
  const cnt=()=>{const n=Object.keys(cam).length;root.querySelector('#clN').textContent=n?n+' material(es) con cambios':'Sin cambios'};
  const draw=()=>{const t=normTxt(fq);const l=ms.filter(x=>(!t||normTxt(x.nombre+' '+(x.categoria||'')).includes(t))&&(fk==='todos'||(fk==='re'?val(x,'reesterilizable'):fk==='sinmin'?!num(val(x,'stock_minimo')):fk==='bajo'?semaforo(x).nivel!=='ok':val(x,'criticidad')===fk)));
    root.querySelector('#clL').innerHTML=`<table class="tbl clas"><tr><th>Material</th>${CRIT_ORD.map(k=>`<th style="text-align:center">${CRIT[k][0].replace('Moderadamente','Mod.')}</th>`).join('')}<th>Existencia</th><th>Mínimo</th><th>Nivel crítico</th><th>Reesteriliza</th><th>Observación</th></tr>${l.map(x=>`<tr data-id="${x.id}"><td>${h(x.nombre)}<div class="muted">${h(x.categoria||'')} · ${h(x.unidad||'')}</div></td>
      ${CRIT_ORD.map(k=>`<td style="text-align:center"><input type="radio" class="clC" name="cr_${x.id}" value="${k}" aria-label="${CRIT[k][0]}" ${val(x,'criticidad')===k?'checked':''}></td>`).join('')}
      <td><b>${fmtN(stockMat(x.id,ubicIdsSede()))}</b></td>
      <td><input class="clMin" type="number" min="0" step="any" style="width:70px" aria-label="Mínimo" value="${h(val(x,'stock_minimo')??0)}"></td>
      <td><input class="clCr" type="number" min="0" step="any" style="width:70px" aria-label="Nivel crítico" value="${h(val(x,'stock_critico')??0)}"></td>
      <td style="text-align:center"><input type="checkbox" class="clR" aria-label="Se reesteriliza" ${val(x,'reesterilizable')?'checked':''}></td>
      <td><input class="clO" placeholder="Método, ciclos máximos…" value="${h(val(x,'reest_obs')||'')}"></td></tr>`).join('')||'<tr><td colspan="9" class="muted">Sin resultados</td></tr>'}</table>`;cnt()};
  root.querySelector('#clQ').oninput=e=>{fq=e.target.value;draw()};root.querySelector('#clK').onchange=e=>{fk=e.target.value;draw()};
  root.querySelector('#clL').addEventListener('change',e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;const id=tr.dataset.id;cam[id]=cam[id]||{};const c=e.target.classList;
    if(c.contains('clC'))cam[id].criticidad=e.target.value;if(c.contains('clR'))cam[id].reesterilizable=e.target.checked;if(c.contains('clO'))cam[id].reest_obs=e.target.value.trim()||null;
    if(c.contains('clMin'))cam[id].stock_minimo=num(e.target.value);if(c.contains('clCr'))cam[id].stock_critico=num(e.target.value);cnt()});
  draw();
  root.querySelector('#clOk').onclick=async()=>{const ids=Object.keys(cam);if(!ids.length)return toast('No hay cambios',true);
    const mal=ids.map(id=>matById(id)).filter(x=>x&&num(val(x,'stock_critico'))>num(val(x,'stock_minimo')));
    if(mal.length)return toast('El nivel crítico debe ser menor o igual al mínimo: '+mal.map(x=>x.nombre).slice(0,3).join(', '),true);
    if(!await pedirPIN('Actualizar '+ids.length+' material(es)'))return;
    try{for(const id of ids){const r={...cam[id],updated_at:new Date().toISOString()};if(r.criticidad)r.critico=r.criticidad==='critico';await q(sb.from('qx_materiales').update(r).eq('id',id),'Actualizar material');Object.assign(matById(id)||{},r);delete cam[id]}
      await logA('clasificar_materiales','qx_materiales',null,{n:ids.length});toast(ids.length+' material(es) actualizados');if(done){done();render()}else draw()}catch(e){}};
}

  <div><label>Proveedor habitual</label><select id="mP"><option value="">—</option>${S.prov.map(p=>`<option value="${p.id}" ${p.id===m0.proveedor_id?'selected':''}>${h(p.nombre)}</option>`).join('')}</select></div>
  <div><label>Stock mínimo (amarillo)</label><input id="mMin" type="number" step="any" value="${m0.stock_minimo}"></div><div><label>Nivel crítico (rojo)</label><input id="mCr" type="number" step="any" value="${m0.stock_critico}"></div>

  <div><label>Gaveta / anaquel (orden del conteo)</label><input id="mG" value="${h(m0.gaveta||'')}" placeholder="Oftalmo A, Refrigerador…"></div>
  <div><label>Piezas por caja / presentación</label><input id="mPz" type="number" min="1" value="${m0.pzas_presentacion||1}"><div class="muted">Si es más de 1, el conteo se captura como cajas cerradas + piezas sueltas.</div></div></div>${m0.notas?`<div class="muted" style="margin-top:6px">Nota: ${h(m0.notas)}</div>`:''}
  <label for="mK">Criticidad</label><div class="seg" id="mK">${CRIT_ORD.map(k=>`<button type="button" data-c="${k}" class="${critOf(m0)===k?'on':''}">${CRIT[k][0]}</button>`).join('')}</div><div class="muted" id="mKd">${CRIT[critOf(m0)][2]}</div>

function importarMat(){
  const m=modal(`${mhead('Carga masiva de materiales')}<div class="muted">Una línea por material, separando con punto y coma (puedes pegar desde Excel con tabuladores):<br><code>nombre ; categoría ; unidad ; mínimo ; nivel crítico ; máximo ; criticidad (crítico/moderado/no) ; existencia inicial ; costo</code><br>Ejemplo: <code>Viscoelástico cohesivo;Viscoelásticos;jeringa;10;4;30;si;18;450</code></div>
  <textarea id="iT" style="min-height:200px;margin-top:8px"></textarea><label>Ubicación para la existencia inicial</label>${selUb('iU',(ubicSede().find(u=>u.tipo==='almacen')||{}).id)}<div class="acts"><button class="btn" id="ok">Importar</button></div>`);
  m.querySelector('#ok').onclick=async()=>{
    const lines=m.querySelector('#iT').value.split('\n').map(l=>l.split(/[;\t]/).map(x=>x.trim())).filter(l=>l[0]);
    if(!lines.length)return;if(!await pedirPIN('Importar '+lines.length+' materiales'))return;
    let n=0;for(const l of lines){
      if(S.mat.some(x=>x.nombre.toLowerCase()===l[0].toLowerCase()))continue;
      const r=(await q(sb.from('qx_materiales').insert({nombre:l[0],categoria:l[1]||'General',unidad:l[2]||'pza',stock_minimo:num(l[3]),stock_critico:num(l[4]),stock_maximo:l[5]?num(l[5]):null,criticidad:/^c|^s/i.test(l[6]||'')?'critico':/^m/i.test(l[6]||'')?'moderado':'no_critico',critico:/^c|^s/i.test(l[6]||''),costo:num(l[8])}).select()))[0];
      S.mat.push(r);if(num(l[7])>0)await ingresar(r.id,m.querySelector('#iU').value,'INICIAL',null,num(l[7]),{nota:'Existencia inicial'});n++}
    m.remove();toast(n+' materiales importados');await loadAll();render()};
}

function formUsuario(id){
  const u=id?S.usuarios.find(x=>x.id===id):{nombre:'',usuario:'',rol:'enfermeria',activo:true};
  const m=modal(`${mhead(id?'Editar usuario':'Nuevo usuario')}<label>Nombre completo</label><input id="uN" value="${h(u.nombre)}"><label>Usuario</label><input id="uU" value="${h(u.usuario)}" ${id?'disabled':''} autocapitalize="none">
  <label>Perfil</label><select id="uR">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===u.rol?'selected':''}>${v}</option>`).join('')}</select>
  <div class="muted" style="margin-top:6px">El perfil pone accesos sugeridos; abajo puedes ajustarlos para esta persona.</div>
  <div class="sw" style="margin-top:10px"><input type="checkbox" id="uMed" ${u.modulos||u.permisos?'checked':''}><label for="uMed" style="margin:0;text-transform:none;font-size:15px;color:var(--ink)">Accesos a la medida (si no, se usan los del perfil)</label></div>
  <div id="uAcc"></div>
  <label>${id?'Nueva contraseña temporal (dejar vacío para no cambiar)':'Contraseña temporal'}</label><input id="uP"><label>${id?'Nuevo PIN (vacío = sin cambio)':'PIN temporal (4 dígitos)'}</label><input id="uPin" inputmode="numeric" maxlength="4">
  <div class="sw"><input type="checkbox" id="uA" ${u.activo?'checked':''}><label for="uA" style="margin:0;text-transform:none;font-size:15px;color:var(--ink)">Activo</label></div>
  <div class="acts"><button class="btn" id="ok">Guardar con PIN</button></div>`,'sm');
  const drawAcc=()=>{const med=m.querySelector('#uMed').checked,rol=m.querySelector('#uR').value,base={rol,modulos:med?u.modulos:null,permisos:med?u.permisos:null};
    const mods=med&&Array.isArray(u._m)?u._m:modsOf(base),pers=med&&Array.isArray(u._p)?u._p:permsOf(base);
    m.querySelector('#uAcc').innerHTML=`<div class="sec-t">Módulos que ve</div><div class="chkgrid">${MODULOS.map(([k,t])=>`<label class="chk"><input type="checkbox" class="uMo" value="${k}" ${mods.includes(k)?'checked':''} ${med?'':'disabled'}>${t}</label>`).join('')}</div>
    <div class="sec-t">Lo que puede hacer</div><div class="chkgrid">${PERMISOS.map(([k,t])=>`<label class="chk"><input type="checkbox" class="uPe" value="${k}" ${pers.includes(k)?'checked':''} ${med&&rol!=='director'?'':'disabled'}>${t}</label>`).join('')}</div>${rol==='director'?'<div class="muted">Dirección General siempre tiene todos los permisos.</div>':''}`;
    m.querySelectorAll('.uMo,.uPe').forEach(x=>x.onchange=()=>{u._m=[...m.querySelectorAll('.uMo:checked')].map(i=>i.value);u._p=[...m.querySelectorAll('.uPe:checked')].map(i=>i.value)})};
  m.querySelector('#uMed').onchange=()=>{if(m.querySelector('#uMed').checked){u._m=modsOf({rol:m.querySelector('#uR').value,modulos:u.modulos});u._p=permsOf({rol:m.querySelector('#uR').value,permisos:u.permisos})}drawAcc()};
  m.querySelector('#uR').onchange=()=>{u._m=null;u._p=null;drawAcc()};drawAcc();
  m.querySelector('#ok').onclick=async()=>{const g=s=>m.querySelector(s).value;const usr=(id?u.usuario:g('#uU')).trim().toLowerCase();
    if(!g('#uN')||!usr)return toast('Nombre y usuario',true);
    if(!id&&(g('#uP').length<6||!/^\d{4}$/.test(g('#uPin'))))return toast('Contraseña de 6+ caracteres y PIN de 4 dígitos',true);
    if(g('#uPin')&&!/^\d{4}$/.test(g('#uPin')))return toast('PIN de 4 dígitos',true);
    if(id===S.user.id&&!m.querySelector('#uA').checked)return toast('No puedes desactivarte a ti mismo',true);
    if(!await pedirPIN('Guardar usuario'))return;
    const med=m.querySelector('#uMed').checked;
    const row={nombre:g('#uN'),rol:g('#uR'),activo:m.querySelector('#uA').checked,modulos:med?[...m.querySelectorAll('.uMo:checked')].map(i=>i.value):null,permisos:med?[...m.querySelectorAll('.uPe:checked')].map(i=>i.value):null};
    if(med&&!row.modulos.length)return toast('Elige al menos un módulo',true);
    if(id===S.user.id&&med&&!row.permisos.includes('usuarios')&&row.rol!=='director')return toast('No te quites a ti mismo el acceso a Usuarios',true);
    if(g('#uP')){row.password_hash=await passHash(usr,g('#uP'));row.debe_cambiar=true;row.intentos_fallidos=0;row.bloqueado_hasta=null}
    if(g('#uPin'))row.pin_hash=await pinHash(usr,g('#uPin'));
    if(!id)row.usuario=usr;
    await q(id?sb.from('qx_usuarios').update(row).eq('id',id):sb.from('qx_usuarios').insert(row),'Guardar usuario');await logA(id?'editar_usuario':'crear_usuario','qx_usuarios',id||usr,{rol:row.rol,modulos:row.modulos,permisos:row.permisos});if(id===S.user.id){S.user.modulos=row.modulos;S.user.permisos=row.permisos;S.user.rol=row.rol;safeLS('qx_user',JSON.stringify(S.user))}m.remove();render()};
}

const fI=(k,lab,def,t,extra)=>`<div><label>${lab}</label><input data-k="${k}" ${t?'type="'+t+'"':''} value="${h(cfg(k,def))}" ${extra||''}></div>`;

    ${S.sedes.map(s=>`<div><label>Sistema anterior de cotizaciones · ${h(s.nombre)}</label><select data-k="cot_tabla_${h(s.nombre)}"><option value="cotizaciones" ${tablaCotDe(s)==='cotizaciones'?'selected':''}>cotizaciones (Tacámbaro)</option><option value="cotizaciones_s2" ${tablaCotDe(s)==='cotizaciones_s2'?'selected':''}>cotizaciones_s2 (Morelia)</option></select></div>`).join('')}</div>${btnG}</div>

    ${fI('dias_proyeccion','Días de proyección (por agotarse)',14,'number')}${fS('conteo_foto','Foto de gaveta obligatoria al cerrar conteo','0',[['1','Sí'],['0','No']])}</div>

}
async function guardarSec(){
  const els=[...document.querySelectorAll('#main [data-k]')];if(!els.length)return;
  if(!await pedirPIN('Guardar configuración'))return;
  for(const e of els){let v=e.value;if(e.type==='number')v=String(num(v));if(e.type==='date'&&!v)continue;await setCfg(e.dataset.k,v.trim())}
  cotCache={};await logA('configuracion','qx_config',null,{claves:els.map(e=>e.dataset.k)});toast('Configuración guardada');render();
}
/* ----- LIO de campaña: cuáles hay en stock y cuáles faltan ----- */
const tipoNorm=t=>normTxt(t||'').replace(/s$/,'');
function lioCampStock(ps,camp){
  const ult=diasCamp(camp).slice(-1)[0]?.fecha||hoyISO(),sedeU=ubicIdsSede();
  const disp=S.lios.filter(l=>l.estado==='disponible'&&sedeU.has(l.ubicacion_id)&&(!l.caducidad||l.caducidad>=ult));
  const usados=new Set(),res={};
  const orden=ps.filter(p=>p.lio_poder!=null&&p.lio_poder!=='').slice().sort((a,b)=>(a.dia||'9')<(b.dia||'9')?-1:(a.dia||'9')>(b.dia||'9')?1:0);
  for(const p of orden){const u=disp.find(l=>!usados.has(l.id)&&Math.abs(num(l.dioptria)-num(p.lio_poder))<0.01&&(!p.lio_tipo||!l.tipo||tipoNorm(l.tipo)===tipoNorm(p.lio_tipo)));
    if(u){usados.add(u.id);res[p.id]=u}else res[p.id]=null}
  return res;
}
function pedirLiosCamp(){
  const c=campActiva(),ps=(S.campPac||[]).filter(p=>p.campana_id===c.id),st=lioCampStock(ps,c);
  const falt={};ps.filter(p=>st[p.id]===null).forEach(p=>{const k=(p.lio_tipo||'LIO')+' '+fmtN(num(p.lio_poder))+' D';falt[k]=(falt[k]||0)+1});
  const ex=Object.entries(falt).sort().map(([k,n])=>({nombre:'LIO '+k+' · '+c.nombre,cantidad:n,unidad:'pza'}));
  if(!ex.length)return toast('Todos los lentes de la campaña están en stock');
  formPedido([],ex);
}
const tablaCotDe=s=>cfg('cot_tabla_'+s.nombre,s.nombre.startsWith('Mor')?'cotizaciones_s2':'cotizaciones');
async function setCfg(k,v){await q(sb.from('qx_config').upsert({clave:k,valor:String(v),updated_at:new Date().toISOString()}));S.config[k]=String(v)}
async function guardarParams(){if(!await pedirPIN('Guardar parámetros'))return;await setCfg('dias_proyeccion',num($('#cDP').value)||14);await setCfg('freq_criticos',num($('#cFC').value)||7);await setCfg('freq_completo',num($('#cFF').value)||15);if($('#cIB').value)await setCfg('inv_base',$('#cIB').value);await setCfg('anticipo_minimo_monto',num($('#cAM').value));await setCfg('anticipo_minimo_pct',num($('#cAP').value));await setCfg('whatsapp_clinica',$('#cWA').value);await setCfg('tel_clinica',$('#cTel').value);await setCfg('meses_control',num($('#cMC').value)||6);await setCfg('meses_control_riesgo',num($('#cMR').value)||4);for(const t of document.querySelectorAll('[data-msg]'))if(t.value.trim()&&t.value!==PLANT[t.dataset.msg])await setCfg('msg_'+t.dataset.msg,t.value);for(const s of document.querySelectorAll('[data-cot]'))await setCfg('cot_tabla_'+s.dataset.cot,s.value);cotCache={};toast('Parámetros guardados');render()}
async function subirLogo(){const f=$('#cLogo').files[0];if(!f)return;if(!await pedirPIN('Cambiar logo'))return;const path='logo/coe-logo-'+Date.now()+'.png';const up=await sb.storage.from('qx-fotos').upload(path,f,{contentType:f.type||'image/png'});if(up.error)return dbErr(up.error,'Logo');await setCfg('logo_url',sb.storage.from('qx-fotos').getPublicUrl(path).data.publicUrl);toast('Logo actualizado');render()}
async function toggleUb(id){const u=ubicById(id);if(!await pedirPIN((u.activa?'Desactivar ':'Activar ')+u.nombre))return;await q(sb.from('qx_ubicaciones').update({activa:!u.activa}).eq('id',id));await loadAll();render()}
function nuevaUb(sid){const m=modal(`${mhead('Nueva ubicación en '+h(sedeById(sid).nombre))}<label>Nombre</label><input id="uN" placeholder="Quirófano 1"><label>Tipo</label><select id="uT"><option value="sala">Quirófano (sala)</option><option value="almacen">Almacén</option></select><div class="acts"><button class="btn" id="ok">Guardar</button></div>`,'sm');
  m.querySelector('#ok').onclick=async()=>{const n=m.querySelector('#uN').value.trim();if(!n)return;if(!await pedirPIN('Crear ubicación'))return;await q(sb.from('qx_ubicaciones').insert({sede_id:sid,nombre:n,tipo:m.querySelector('#uT').value,orden:S.ubic.filter(u=>u.sede_id===sid).length+1}));m.remove();await loadAll();render()}}
function nuevaSede(){const m=modal(`${mhead('Nueva sede')}<label>Nombre</label><input id="sN"><div class="acts"><button class="btn" id="ok">Guardar</button></div>`,'sm');m.querySelector('#ok').onclick=async()=>{const n=m.querySelector('#sN').value.trim();if(!n)return;if(!await pedirPIN('Crear sede'))return;await q(sb.from('qx_sedes').insert({nombre:n}));m.remove();await loadAll();render()}}
async function nuevaEsp(){const n=$('#nEsp').value.trim();if(!n)return;if(!await pedirPIN('Agregar especialidad'))return;await q(sb.from('qx_especialidades').insert({nombre:n}));await loadAll();render()}
function vBitacora(out){out('<h2>Bitácora</h2><div class="card" id="bit"><div class="muted">Cargando…</div></div>')}
async function cargarBitacora(){const r=await q(sb.from('qx_log').select('*').order('created_at',{ascending:false}).limit(150));const el=$('#bit');if(el)el.innerHTML=`<div class="tblwrap"><table><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>${r.map(x=>`<tr><td>${fDT(x.created_at)}</td><td>${h(x.usuario_nombre||'')}</td><td>${h((x.accion||'').replace(/_/g,' '))}</td><td class="muted">${h(x.detalle?Object.entries(x.detalle).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · '):'')}</td></tr>`).join('')}</table></div>`}

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw-quirofano.js').catch(()=>{});
(function boot(){
  let tries=0;const wait=()=>{if(window.supabase){sb=envolverSB(window.supabase.createClient(SUPA_URL,SUPA_KEY,{global:{fetch:fetchTO}}));const seg=new URLSearchParams(location.search).get('seg');if(seg)return paginaPaciente(seg);const cotT=new URLSearchParams(location.search).get('cot');if(cotT)return paginaCotPublica(cotT);aplicarTema();const indT=new URLSearchParams(location.search).get('ind');if(indT)return paginaIndic(indT);const u=safeLS('qx_user');if(u){try{S.user=JSON.parse(u);iniciar()}catch(e){pantallaLogin()}}else pantallaLogin()}else if(tries++<50)setTimeout(wait,100);else document.getElementById('app').innerHTML='<div class="empty">No se pudo cargar la librería de Supabase. Revisa la conexión a internet.</div>'};wait();
})();
