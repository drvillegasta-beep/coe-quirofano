<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COE Farmacia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky summary strip + tabs; one working pane. Receta = form left, live letter-size preview right. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --ink:#1a1a1a; --muted:#5e666c; --line:#d5dadd;
  --accent:#2c4a5e; --accent-soft:#e3eaef;
  --ok:#1f7a45; --ok-soft:#e2f3e8; --warn:#a86400; --warn-soft:#fbefd9;
  --crit:#b3261e; --crit-soft:#fbe3e1; --dead:#2b2b2b; --dead-soft:#e4e4e4;
  --red:#c0392b; --shadow:0 1px 2px rgba(20,32,44,.06),0 6px 20px rgba(20,32,44,.05); --overlay:rgba(14,22,30,.45);
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --f-serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --side:#122029; --side-ink:#c3cfd8; --side-hi:#ffffff; --side-act:rgba(255,255,255,.09);
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#ff7b6b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  --bg:#111518; --surface:#1a2025; --ink:#e8ecee; --muted:#9aa5ac; --line:#2c353c;
  --accent:#8fb6cf; --accent-soft:#1d3140;
  --ok:#5cc58a; --ok-soft:#173527; --warn:#f0b04a; --warn-soft:#3a2b10;
  --crit:#ff8a80; --crit-soft:#41191a; --dead:#e0e0e0; --dead-soft:#333; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#ff7b6b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  --bg:#111518; --surface:#1a2025; --ink:#e8ecee; --muted:#9aa5ac; --line:#2c353c;
  --accent:#8fb6cf; --accent-soft:#1d3140;
  --ok:#5cc58a; --ok-soft:#173527; --warn:#f0b04a; --warn-soft:#3a2b10;
  --crit:#ff8a80; --crit-soft:#41191a; --dead:#e0e0e0; --dead-soft:#333; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .iso{width:34px;height:34px;flex:none;background:var(--ink);-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat}
.logo b{display:block;font-size:16px}
.logo small{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.spacer{flex:1}
.online{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok)}
.online i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.role{display:flex;align-items:center;gap:6px;font-size:13px}
.role select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px}
.bell span{position:absolute;top:-7px;right:-7px;background:var(--crit);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}

.strip{display:flex;gap:8px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.kpi{flex:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);text-align:left;min-width:108px}
.kpi b{display:block;font-size:20px;font-family:var(--f-mono)}
.kpi small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi.crit{border-color:var(--crit);background:var(--crit-soft)} .kpi.crit b{color:var(--crit)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)} .kpi.warn b{color:var(--warn)}
.kpi.dead{border-color:var(--dead);background:var(--dead-soft)}
.kpi.ok b{color:var(--ok)}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:18px 60px}
h2{font-size:20px;margin:0 0 12px;text-wrap:balance}
h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.note{font-size:13px;color:var(--muted)}
.proto{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)} .c-dead{background:var(--dead);color:var(--bg)}
.c-info{background:var(--accent-soft);color:var(--accent)} .c-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.desc{font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:12px}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--surface);width:100%}
.cnt{width:70px!important;text-align:right;font-family:var(--f-mono)}
.diff0{color:var(--ok);font-weight:700} .diffn{color:var(--crit);font-weight:700} .diffp{color:var(--warn);font-weight:700}
.totals{display:grid;grid-template-columns:auto auto auto auto;gap:4px 18px;justify-content:end;font-size:14px;margin-top:12px}
.totals b{font-family:var(--f-mono);text-align:right}
.import{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}

.alert{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.acc td.c,.acc th.c{text-align:center;vertical-align:middle}.acc th.c{font-size:11px}.acc tr.grp td{background:var(--bg);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:var(--muted)}.acc input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.asbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:2px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.alert+.alert{margin-top:8px}
.alert .bar{align-self:stretch;border-radius:3px}
.alert p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.steps span{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.bars{display:grid;gap:6px}
.bars div{display:grid;grid-template-columns:160px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.bars i{display:block;height:12px;border-radius:3px;background:var(--accent)}

.rx{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.rx{grid-template-columns:1fr}}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medcard{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--bg)}
.medcard .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.sugg{margin-top:8px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:7px 9px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sugg.crit{border-color:var(--crit);background:var(--crit-soft)}
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.eyeseg{display:flex;gap:4px}
.eyeseg button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 0;font-weight:700}
.eyeseg button[aria-pressed="true"]{border-color:var(--ink)}

/* ===== hoja impresa: siempre blanco y negro ===== */
.paperwrap{overflow-x:auto;background:var(--line);border-radius:10px;padding:14px}
.paper{width:816px;min-height:1056px;margin:0 auto;background:#fff;color:#111;padding:44px 52px 36px;font-family:var(--f-body);box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;flex-direction:column}
.p-head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.p-iso{width:62px;height:63px;background:#111;-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat}
.p-brand{font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;line-height:1.5}
.p-brand span{display:block;letter-spacing:.32em;color:#555;font-size:10.5px;margin-top:2px}
.p-doc{text-align:right}
.p-doc .nm{font-family:var(--f-serif);font-size:24px;font-weight:600;line-height:1.1}
.p-doc .es{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.p-doc .ce{font-size:11.5px;color:#333;margin-top:2px;font-variant-numeric:tabular-nums}
.p-rule{border:0;border-top:1.5px solid #111;margin:16px 0 0}
.p-rule.thin{border-top:.75px solid #111;margin-top:3px}
.p-pat{display:grid;grid-template-columns:2.6fr .8fr 1.2fr 1.2fr;gap:6px 22px;margin:16px 0 4px}
.p-lab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#555;display:block;margin-bottom:2px}
.p-val{font-size:18px;font-weight:700}
.p-dx{margin:10px 0 0;padding:10px 0;border-top:.75px solid #999;border-bottom:.75px solid #999}
.p-rp{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:40px;line-height:1;margin:16px 0 6px}
.p-med{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:12px 0 14px;border-bottom:.75px solid #bbb}
.p-med .n{font-family:var(--f-serif);font-size:34px;font-weight:600;line-height:1;grid-row:span 3}
.p-med .nm{font-size:25px;font-weight:700;line-height:1.15}
.p-med .nm small{font-size:15px;font-weight:400;color:#333}
.p-med .how{font-size:20px;line-height:1.4}
.p-eye{display:inline-block;border:2.5px solid #111;padding:1px 10px;font-weight:700;letter-spacing:.06em;margin-right:8px}
.p-gen{font-size:15px;line-height:1.5;margin-top:14px}
.p-gen b{letter-spacing:.06em}
.p-foot{margin-top:auto;padding-top:18px;display:grid;grid-template-columns:1fr 260px auto;gap:18px;align-items:end}
.p-next .p-val{font-size:17px}
.p-sign{border-top:1px solid #111;padding-top:5px;text-align:center;font-size:12px;line-height:1.35}
.p-sign b{font-family:var(--f-serif);font-size:16px;font-weight:600}
.qrbox{text-align:center;font-size:9.5px;line-height:1.25;color:#333}
.p-addr{margin-top:14px;padding-top:7px;border-top:.75px solid #111;font-size:10px;letter-spacing:0;color:#333;text-align:center}

/* ilustrada */
.il-intro{font-size:13px;color:#333;margin:14px 0 10px}
.il-card{border:3px solid #111;border-radius:18px;padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:92px 104px 1fr 96px;gap:10px;align-items:center}
.il-stk{width:92px;height:92px;border-radius:50%;border:4px solid #111;display:grid;place-items:center;font-size:58px;line-height:1;background:#fff}
.il-face{display:grid;justify-items:center}
.il-times{display:flex;gap:6px;justify-content:center}
.il-t{display:grid;justify-items:center;gap:4px;padding:6px 4px 8px;border:2px solid #111;border-radius:12px;min-width:0;flex:1;max-width:96px}.il-t svg{max-width:100%}
.il-drops{display:flex;gap:2px}
.il-cal{display:grid;justify-items:center}
.il-fam{font-size:12.5px;color:#333;grid-column:1/-1;border-top:1px dashed #999;padding-top:6px}

/* ===== refinamiento visual ===== */
body{background:var(--bg)}
header.top{box-shadow:var(--shadow);border-bottom:0}
.logo b{font-size:17px;letter-spacing:.01em}
.panel{border-color:transparent;box-shadow:var(--shadow);border-radius:14px}
.kpi{background:var(--surface);border-color:var(--line);border-radius:12px;padding:8px 12px;min-width:116px;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.kpi.crit,.kpi.warn,.kpi.dead{background:var(--surface)}
.kpi small{display:flex;align-items:center;gap:6px}
.kpi.crit small::before,.kpi.warn small::before,.kpi.dead small::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.kpi.crit small{color:var(--crit)} .kpi.warn small{color:var(--warn)} .kpi.dead small{color:var(--dead)}
nav.tabs{gap:4px;padding-block:4px 8px}
nav.tabs button{border:0;border-radius:999px;padding:8px 16px;color:var(--muted)}
nav.tabs button:hover{background:var(--bg);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface);border:0}
.btn{border-radius:9px;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);width:100%;font-size:16px;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rxform .field label{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700}
.req{font-weight:400;color:var(--crit);font-size:12px;margin-left:4px}
.sec-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;border-top:1px solid var(--line)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);display:block;min-width:46px}
.top2{display:flex;gap:16px;flex-wrap:wrap}
.top2 .lbl{margin-bottom:4px}
.seg2{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg2 button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:700;display:grid;justify-items:center;line-height:1.15;color:var(--muted)}
.seg2 button small{font-weight:400;font-size:11px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg2.sm button{padding:6px 12px;font-size:14px}
.tplgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;color:var(--ink);transition:border-color .12s,transform .12s}
.tpl:hover{border-color:var(--accent);transform:translateY(-1px)}
.tpl svg{flex:none;color:var(--ink)}
.tpl span{display:grid;min-width:0}
.tpl b{font-size:14px;line-height:1.2}
.tpl small{color:var(--muted);font-size:12px}
.inp-ic{position:relative}
.inp-ic svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.inp-ic input{padding-left:38px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--bg);width:38px;height:40px;font-size:20px;font-weight:700}
.stepper button:hover{background:var(--accent-soft)}
.stepper span{padding:0 12px;font-weight:700;white-space:nowrap}
.stepper.wide{display:flex}
.stepper.wide input{border:0;border-radius:0;text-align:center;width:100%;min-width:0;padding:8px 4px;box-shadow:none}
.stepper .unit{font-weight:400;color:var(--muted);padding:0 8px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.sm{margin-top:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chips.sm button{font-size:12.5px;padding:4px 10px;font-weight:400}
.chips button:hover{border-color:var(--accent);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.medcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.mc-h{display:flex;align-items:center;gap:8px}
.pat2{grid-template-columns:150px minmax(0,1fr)}
.stepper.wide{height:46px}.stepper.wide button{height:100%}
.mc-h .num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.mc-n{flex:1;min-width:0;display:grid}
.mc-n small .chip{font-size:11px;padding:1px 7px}
.mc-n b{font-size:17px}
.mc-n small{color:var(--muted);font-size:12.5px}
.mc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:16px}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-left:auto;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked+.tr{background:var(--accent)}
.sw input:checked+.tr::after{transform:translateX(16px)}
.sw input:focus-visible+.tr{outline:3px solid var(--accent);outline-offset:2px}
.hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:10px;padding:8px 10px;font-size:13px}
.hint span{flex:1;min-width:160px}
.hint.warn{background:var(--warn-soft)} .hint.crit{background:var(--crit-soft)} .hint.info{background:var(--accent-soft)}
.addmed{width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px;font-weight:700;color:var(--accent);margin-top:2px}
